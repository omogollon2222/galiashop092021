y><div class=\"records-content\"><p class=\"legend\"><span class=\"pink-text\">Rosa:<\/span> 90 días sin movimiento y con existencias. <span class=\"green-text\">Verde:<\/span> dos o más ventas distintas en los últimos 90 días.<\/p><div id=\"items\"><\/div><p class=\"sync\" id=\"syncStatus\" aria-live=\"polite\">Preparando inventario…<\/p><div class=\"note\">El archivo diario de inventario se guardará en <a href=\"https://drive.google.com/drive/folders/16Ujigmu41NZOLHtRo-8h1uifjLPhUd7r\" target=\"_blank\" rel=\"noopener\">Galia Shop / Inventario<\/a>. Las ventas sin código no podrán asociarse con una prenda.<\/div><button class=\"btn subtle\" id=\"export\" type=\"button\">Exportar inventario a Excel<\/button><\/div><\/details><\/main><div class=\"scanner\" id=\"scanner\"><div class=\"scanner-box\"><p>Apunta al código de barras<\/p><video id=\"scanVideo\" autoplay playsinline muted><\/video><button class=\"btn\" id=\"closeScan\" type=\"button\">Cerrar cámara<\/button><\/div><\/div><div role=\"status\" aria-live=\"polite\" class=\"toast\" id=\"toast\"><\/div><script>const key='galia-shop-inventory-v1',fields=['purchaseDate','quantity','supplier','purchasePrice','salePrice','category','color','description','code','lastSaleDate'];let editId=null,sales=[],syncTimer,photoKey=\"\",scanStream=null,scanActive=false;const $=id=>document.getElementById(id);const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Guayaquil',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('purchaseDate').value=today();function load(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function xml(s){return String(s??'').replace(/[<>&\"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','\"':'&quot;'}[c]))}function msg(s){let el=$('toast');el.textContent=s;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout IA<\/small><h1>Análisis para tomar decisiones<\/h1><\/header><nav class=\"tabs\"><a href=\"/registro.html\">Ventas<\/a><a href=\"/inventario.html\">Inventario<\/a><a class=\"active\" href=\"/analisis.html\" aria-current=\"page\">Análisis<\/a><\/nav><section class=\"panel controls\"><label>Fecha de análisis<input id=\"date\" type=\"date\"><\/label><button class=\"btn\" id=\"close\">Cerrar día<\/button><button class=\"btn secondary\" id=\"pdf\">Reporte PDF<\/button><\/section><p class=\"status\" id=\"status\" aria-live=\"polite\">Cargando datos…<\/p><div class=\"grid\" id=\"metrics\"><\/div><section class=\"panel\"><h2>Ventas diarias<\/h2><div class=\"table-wrap\" id=\"daily\"><\/div><\/section><section class=\"panel\"><h2>Productos estrella<\/h2><p class=\"hint\">Ordenados por ingresos. Se agrupan por código; sin código, por descripción.<\/p><div class=\"table-wrap\" id=\"stars\"><\/div><\/section><section class=\"panel\"><h2>Utilidad por producto<\/h2><p class=\"hint\">Utilidad bruta estimada = venta menos costo de compra. No incluye arriendo, transporte, comisiones ni otros gastos. El costo se busca por código en Inventario.<\/p><div class=\"table-wrap\" id=\"profit\"><\/div><\/section><section class=\"panel\"><h2>Recomendaciones para vender más<\/h2><ol id=\"recommendations\" class=\"rec-list\"><\/ol><\/section><section class=\"panel\"><h2>Cierres diarios<\/h2><div id=\"closures\" class=\"hint\">Cargando…<\/div><\/section><\/main><article class=\"report\" id=\"report\"><\/article><script>\nconst $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Guayaquil',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('date').value=today();let sales=[],inventory=[],closures=[];const items=x=>Array.isArray(x.items)&&x.items.length?x.items:[{description:x.descript  hay ventas registradas para '+d.date+'.';return d}async function load(){try{let responses=await Promise.all(['/api/sales','/api/inventory','/api/closures'].map(url=>fetch(url,{cache:'no-store'})));if(responses.some(r=>!r.ok))throw Error('No se pudieron cargar los datos. Inicia sesión e inténtalo de nuevo.');let [a,b,c]=await Promise.all(responses.map(r=>r.json()));sales=a.sales||[];inventory=b.inventory||[];closures=c.closures||[];render()}catch(e){$('status').textContent=e.message}}$('date').addEventListener('change',render);$('close').addEventListener('click',async()=>{let d=data();if(!d.day.length)return;if(!await galiaConfirm('¿Cerrar el '+d.date+' con '+d.day.length+' ventas y '+money(d.revenue)+'? El cierre guardará estas cifras.'))return;try{let r=await fetch('/api/closures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:d.date})});if(!r.ok)throw Error('No se pudo guardar el cierre');let result=await r.json();closures=[result.closure,...closures.filter(x=>x.date!==d.date)];render()}catch(e){$('status').textContent=e.message}});$('pdf').addEventListener('click',()=>{let d=data(),closed=closures.find(x=>x.date===d.date),profitKnown=d.products.reduce((n,x)=>n+x.profit,0),unknown=d.products.reduce((n,x)=>n+x.unknown,0);$('report').innerHTML=`<h1>Galia Shop · Reporte a gerencia<\/h1><p>Fecha: ${esc(d.date)} · ${closed?'Cierre guardado el '+esc(closed.createdAt.slice(0,10)):'Reporte previo al cierre'}<\/p><h2>Resumen diario<\/h2><p>${d.day.length} ventas · Total ${money(d.revenue)} · Cobrado ${money(d.paid)} · Saldo pendiente ${money(d.pending)}<\/p><p>Utilidad bruta estimada de productos con costo: ${money(profitKnown)}${unknown?' · '+unknown+' unidades sin costo registrado':''}.<\/p><p class=\"report-note\">El total de ventas no equivale al dinero cobrado. La utilidad no incluye gastos operativos; los productos sin costo se excluyen de su cálculo.<\/p><h2>Productos estrella<\/h2>${table(['Producto','Unidades','Ventas'],d.products.slice(0,10).map(x=>[esc(x.label),x.quantity,money(x.revenue)]))}<h2>Utilidad por producto<\/h2>${table(['Producto','Utilidad estimada'],d.products.map(x=>[esc(x.label),x.known?money(x.profit)+(x.unknown?' (parcial)':''):'Sin costo registrado']))}<h2>Recomendaciones<\/h2><ol>${recommendations(d).map(x=>'<li>'+esc(x)+'<\/li>').join('')}<\/ol><footer>Reporte generado para la gerencia de Galia Shop. Guarda como PDF desde la ventana de impresión.<\/footer>`;window.print()});load();\n<\/script><\/body><\/html>\n"}, "shim": "(function(){\n  var P = window.parent;\n  var realFetch = window.fetch.bind(window);\n  window.fetch = function(u, o){\n    var s = typeof u === 'string' ? u : (u && u.url) || String(u);\n    if (s.indexOf('/api/') === 0) return P.galiaApi(s, o || {});\n    return realFetch(u, o);\n  };\n  window.blobUrl = function(k){ return P.galiaBlob(k); };\n  document.addEventListener('click', function(e){\n    var a = e.target && e.target.closest && e.target.closest('a[href]');\n    if (!a) return;\n    var m = (a.getAttribute('href') || '').match(/^\\/(registro|inventario|analisis)\\.html/);\n    if (m) { e.preventDefault(); P.galiaShow(m[1]); }\n  }, true);\n})();\n(function(){\n  // Ventanas de confirmación propias (los avisos del navegador pueden estar bloqueados dentro de Claude)\n  function box(text, withInput){\n    return new Promise(function(res){\n      var o = document.createElement('div');\n      o.style.cssText = 'position:fixed;inset:0;background:#241d20aa;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,Segoe UI,sans-serif';\n      var c = document.createElement('div');\n      c.style.cssText = 'background:#fff;border-radius:18px;padding:20px;max-width:380px;width:100%;box-shadow:0 12px 40px #0004;color:#241d20';\n      var p = document.createElement('p'); p.style.cssText = 'margin:0 0 14px;font-size:16px;line-height:1.45;white-space:pre-line'; p.textContent = text; c.appendChild(p);\n      var inp = null;\n      if (withInput) { inp = document.createElement('input'); inp.inputMode = 'decimal'; inp.style.cssText = 'width:100%;box-sizing:border-box;min-height:46px;border:1px solid #ddcdd2;border-radius:12px;padding:10px 12px;font-size:16px;margin-bottom:14px'; c.appendChild(inp); }\n      var row = document.createElement('div'); row.style.cssText = 'display:flex;gap:10px';\n      function b(label, primary, val){ var x = document.createElement('button'); x.type = 'button'; x.textContent = label;\n        x.style.cssText = 'flex:1;min-height:46px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:' + (primary ? '0;background:#a8617b;color:#fff' : '1px solid #dfc5cf;background:#fff;color:#713c51');\n        x.onclick = function(){ o.remove(); res(val === 'input' ? inp.value : val); }; row.appendChild(x); return x; }\n      b('Cancelar', false, withInput ? null : false);\n      var ok = b('Aceptar', true, withInput ? 'input' : true);\n      c.appendChild(row); o.appendChild(c); document.body.appendChild(o);\n      (inp || ok).focus();\n    });\n  }\n  window.galiaConfirm = function(t){ return box(t, false); };\n  window.galiaPrompt = function(t){ return box(t, true); };\n})();\n"}</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('galia-data').textContent);
  var frames = document.getElementById('frames');
  var current = null;

  /* ---------- capacidades de Claude ---------- */
  function use(name){
    try { return (window.claude && window.claude.use) ? window.claude.use(name).catch(function(){return null}) : null; }
    catch(e){ return null; }
  }
  // window.claude aparece después del primer arranque: esperamos hasta 12 s
  function waitUse(name){
    return new Promise(function(res){
      var t0 = Date.now();
      (function tick(){
        if (window.claude && window.claude.use) { use(name).then(res); return; }
        if (Date.now() - t0 > 12000) return res(null);
        setTimeout(tick, 100);
      })();
    });
  }
  var dbP = waitUse('db');
  var assetsP = null;
  function getAssets(){ return assetsP || (assetsP = waitUse('assets')); }

  /* ---------- utilidades ---------- */
  function json(obj, status){
    return new Response(JSON.stringify(obj), {status: status || 200, headers: {'Content-Type': 'application/json'}});
  }
  function body(o){
    try { return typeof o.body === 'string' ? JSON.parse(o.body) : null; } catch(e){ return null; }
  }
  function key(id){ return 's_' + String(id).replace(/[^A-Za-z0-9_-]/g, '_'); }
  function dayOf(sale){ var d = String(sale.date || ''); return /^\d{4}-\d{2}-\d{2}/.test(d) ? d.slice(0,10) : 'sin-fecha'; }
  function same(a, b){ return JSON.stringify(a) === JSON.stringify(b); }

  // Ventas: un documento por día -> { s_<id>: venta, ... }
  async function readSales(db){
    var snap = await db.collection('sales').get();
    var list = [], where = {};
    snap.docs.forEach(function(d){
      var data = d.data() || {};
      Object.keys(data).forEach(function(k){
        var v = data[k];
        if (v && typeof v === 'object' && typeof v.id === 'string') { list.push(v); where[v.id] = {day: d.id, k: k, v: v}; }
      });
    });
    list.sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
    return {list: list, where: where, days: snap.docs.reduce(function(m,d){ m[d.id] = true; return m; }, {})};
  }
  async function patchDay(db, day, patch, exists){
    var ref = db.doc('sales/' + day);
    if (exists) { try { await ref.update(patch); return; } catch(e){ /* cae a set */ } }
    var cur = (await ref.get()); var base = cur.exists ? (cur.data() || {}) : {};
    Object.keys(patch).forEach(function(k){ if (patch[k] === null) delete base[k]; else base[k] = patch[k]; });
    await ref.set(base);
  }

  async function readAll(db, coll){
    var snap = await db.collection(coll).get();
    return snap.docs.map(function(d){ return {id: d.id, data: d.data() || {}}; });
  }

  /* ---------- API que antes estaba en el servidor ---------- */
  window.galiaApi = async function(url, o){
    var method = String(o.method || 'GET').toUpperCase();
    var path = url.split('?')[0];
    var db = await dbP;
    if (!db) return json({error: 'Acceso no autorizado'}, 401);
    try {
      if (path === '/api/sales') {
        if (method === 'GET') { var r = await readSales(db); return json({sales: r.list}); }
        if (method === 'POST') {
          var b = body(o);
          if (!b || !Array.isArray(b.sales) || b.sales.length > 5000) return json({error: 'Datos inválidos'}, 400);
          if (b.sales.some(function(x){ return !x || typeof x.id !== 'string' || typeof x.date !== 'string' || typeof x.client !== 'string' || typeof x.amount !== 'number'; }))
            return json({error: 'Venta inválida'}, 400);
          var cur = await readSales(db), patches = {};
          b.sales.forEach(function(x){
            var day = dayOf(x), k = key(x.id), old = cur.where[x.id];
            if (old && old.day === day && same(old.v, x)) return;
            if (old && old.day !== day) (patches[old.day] = patches[old.day] || {})[old.k] = null;
            (patches[day] = patches[day] || {})[k] = x;
          });
          for (var d in patches) await patchDay(db, d, patches[d], !!cur.days[d]);
          return json({saved: b.sales.length, drive: 'unconfigured'});
        }
        if (method === 'DELETE') {
          var bd = body(o);
          if (!bd || typeof bd.id !== 'string' || !bd.id) return json({error: 'Venta inválida'}, 400);
          var c2 = await readSales(db), hit = c2.where[bd.id];
          if (hit) { var p = {}; p[hit.k] = null; await patchDay(db, hit.day, p, true); }
          return json({deleted: true, drive: 'unconfigured'});
        }
      }
      if (path === '/api/drive-sync') return json({drive: 'unconfigured'});
      if (path === '/api/inventory') {
        if (method === 'GET') {
          var inv = await readAll(db, 'inventory');
          inv.sort(function(a,b){ return String(b.data._u||'').localeCompare(String(a.data._u||'')); });
          return json({inventory: inv.map(function(r){ var x = Object.assign({}, r.data); delete x._u; return x; })});
        }
        if (method === 'POST') {
          var bi = body(o);
          if (!bi || !Array.isArray(bi.inventory) || bi.inventory.length > 5000) return json({error: 'Datos inválidos'}, 400);
          var items = bi.inventory;
          if (items.some(function(x){ return !x || typeof x.id !== 'string' || typeof x.code !== 'string' || typeof x.purchaseDate !== 'string' || typeof x.quantity !== 'number' || typeof x.purchasePrice !== 'number' || typeof x.salePrice !== 'number'; }))
            return json({error: 'Prenda inválida'}, 400);
          var codes = items.map(function(x){ return String(x.code).trim().toUpperCase(); });
          if (new Set(codes).size !== codes.length) return json({error: 'Hay códigos repetidos'}, 400);
          var existing = await readAll(db, 'inventory'), have = {};
          existing.forEach(function(r){ have[r.id] = r.data; });
          var now = new Date().toISOString(), keep = {};
          for (var i = 0; i < items.length; i++) {
            var x = items[i], id = key(x.id); keep[id] = true;
            var prev = have[id];
            if (prev) { var pc = Object.assign({}, prev); delete pc._u; if (same(pc, x)) continue; }
            await db.doc('inventory/' + id).set(Object.assign({}, x, {_u: now}));
          }
          for (var eid in have) if (!keep[eid]) await db.doc('inventory/' + eid).delete();
          return json({saved: items.length});
        }
      }
      if (path === '/api/inventory/photo' && method === 'POST') {
        var file = o.body && o.body.get ? o.body.get('photo') : null;
        var okTypes = {'image/jpeg':1, 'image/png':1, 'image/webp':1};
        if (!file || !okTypes[file.type] || file.size > 5000000 || file.size === 0)
          return json({error: 'Elige una foto JPG, PNG o WebP de hasta 5 MB'}, 400);
        var assets = await getAssets();
        if (!assets) return json({error: 'No tienes permiso para subir fotos en Galia Shop'}, 403);
        try { var up = await assets.upload(file); return json({photoKey: up.id}); }
        catch(e){ return json({error: 'No se pudo guardar la foto'}, 503); }
      }
      if (path === '/api/closures') {
        if (method === 'GET') {
          var cl = await readAll(db, 'closures');
          cl.sort(function(a,b){ return String(b.data.date||'').localeCompare(String(a.data.date||'')); });
          return json({closures: cl.map(function(r){ return r.data; })});
        }
        if (method === 'POST') {
          var bc = body(o);
          if (!bc || typeof bc.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(bc.date)) return json({error: 'Fecha inválida'}, 400);
          var ref = db.doc('closures/' + bc.date), ex = await ref.get();
          if (ex.exists) return json({closure: ex.data(), alreadyClosed: true});
          var all = (await readSales(db)).list.filter(function(x){ return x.date === bc.date; });
          var amount = Math.round(all.reduce(function(n,x){ return n + Number(x.amount||0); }, 0)*100)/100;
          var paid = Math.round(all.reduce(function(n,x){ return n + Number(x.paid != null ? x.paid : (x.amount || 0)); }, 0)*100)/100;
          var closure = {date: bc.date, createdAt: new Date().toISOString(), saleIds: all.map(function(x){ return x.id; }), count: all.length, amount: amount, paid: paid, pending: Math.max(0, Math.round((amount-paid)*100)/100)};
          await ref.set(closure);
          return json({closure: closure, alreadyClosed: false});
        }
      }
      return json({error: 'No encontrado'}, 404);
    } catch(e) {
      console.error('[galia]', e);
      var code = e && e.code;
      if (code === 'not_granted') return json({error: 'Tu acceso es solo de lectura. Pide al administrador permiso para editar.'}, 403);
      if (code === 'quota_exceeded') return json({error: 'Se llenó el espacio de datos. Descarga un respaldo y avisa al administrador.'}, 507);
      return json({error: 'No se pudo conectar. Inténtalo de nuevo.'}, 503);
    }
  };
  var dlP = null;
  window.galiaSave = async function(blob, name){
    var dl = await (dlP || (dlP = waitUse('downloads')));
    if (!dl) return;
    try { await dl.save({filename: name, data: blob}); } catch(e) { console.warn('[galia] descarga', e && e.code); }
  };
  window.galiaBlob = function(id){ return new URL('/_blob/' + encodeURIComponent(id), location.href).href; };

  /* ---------- pantallas ---------- */
  function build(name){
    var html = DATA.pages[name];
    var inject = '<script>' + DATA.shim + '<\/script>';
    html = html.replace(/<head([^>]*)>/i, function(m){ return m + inject; });
    var f = document.createElement('iframe');
    f.title = 'Galia Shop · ' + name;
    f.setAttribute('allow', 'camera; clipboard-write');
    f.srcdoc = html;
    return f;
  }
  window.galiaShow = function(name){
    if (!DATA.pages[name]) name = 'registro';
    var f = build(name);
    frames.appendChild(f);
    f.addEventListener('load', function(){
      document.getElementById('boot').style.display = 'none';
      if (current && current !== f) current.remove();
      current = f;
      try { f.contentWindow.focus(); } catch(e){}
    }, {once: true});
    try { history.replaceState(null, '', '#' + name); } catch(e){}
  };
  var start = (location.hash || '').slice(1);
  galiaShow(DATA.pages[start] ? start : 'registro');
})();
</script>
