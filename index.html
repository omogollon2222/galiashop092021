ean).join(' · '), code: c, quantity: 1, price: Number(item.salePrice).toFixed(2)} : {code: c, quantity: 1};\n    var last = rows[rows.length - 1];\n    var empty = last && !rowVal(last, 'description') && !rowVal(last, 'code') && !rowVal(last, 'price');\n    var target;\n    if (empty) {\n      ['description','code','quantity','price'].forEach(function(f){ if (data[f] != null) last.querySelector('[data-field=\"' + f + '\"]').value = data[f]; });\n      target = last; updateTotal();\n    } else { addProductRow(data); target = document.getElementById('productList').lastElementChild; }\n    flash(target);\n    if (!item) { msg('Código ' + c + ' no está en Inventario: escribe descripción y precio'); target.querySelector('[data-field=\"description\"]').focus(); return; }\n    var left = Number(item.quantity) - soldUnits(c);\n    msg(left <= 0 ? '⚠ ' + c + ' figura sin existencias en Inventario' : 'Agregado: ' + (item.description || c) + ' · ' + money(item.salePrice));\n  };\n  function flash(el){ if (!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); el.scrollIntoView({block: 'nearest', behavior: 'smooth'}); }\n\n  /* ---------- Buscar producto por parte del código o del nombre ---------- */\n  (function(){\n    var st = document.createElement('style');\n    st.textContent = '.code-suggest{position:absolute;z-index:50;background:#fff;border:1px solid #dfc5cf;border-radius:14px;box-shadow:0 14px 34px #54313b26;max-height:300px;overflow:auto;padding:5px}'\n      + '.code-suggest button{display:flex;width:100%;gap:10px;align-items:center;justify-content:space-between;text-align:left;border:0;background:none;border-radius:10px;padding:10px 11px;font:inherit;color:#241d20;cursor:pointer}'\n      + '.code-suggest button.on,.code-suggest button:hover{background:#f7e9ee}'\n      + '.code-suggest .cs-main{min-width:0;display:flex;flex-direction:column;gap:2px}'\n      + '.code-suggest .cs-code{font-weight:750;font-size:14px;color:#8f526a}'\n      + '.code-suggest .cs-desc{font-size:14px;line-height:1.3}'\n      + '.code-suggest .cs-side{text-align:right;white-space:nowrap;font-size:13px;color:#776b70}'\n      + '.code-suggest .cs-side b{display:block;font-size:15px;color:#241d20}'\n      + '.code-suggest .cs-out{color:#b0563b}'\n      + '.code-suggest .cs-empty{padding:12px;font-size:14px;color:#7d6d72;line-height:1.4}'\n      + '.code-suggest mark{background:#f3d7e1;color:inherit;border-radius:3px}';\n    document.head.appendChild(st);\n\n    var box = document.createElement('div'); box.className = 'code-suggest'; box.hidden = true;\n    box.setAttribute('role', 'listbox');\n    document.body.appendChild(box);\n    var input = null, hits = [], active = -1, lastLoad = Date.now();\n\n    function plain(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }\n    function escH(s){ return String(s == null ? '' : s).replace(/[&<>\"']/g, function(c){ return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;'}[c]; }); }\n    function mark(text, q){\n      var t = String(text || ''), i = plain(t).indexOf(q);\n      return i < 0 || !q ? escH(t) : escH(t.slice(0, i)) + '<mark>' + escH(t.slice(i, i + q.length)) + '<\/mark>' + escH(t.slice(i + q.length));\n    }\n    function search(q){\n      q = plain(q).trim(); if (!q) return [];\n      var words = q.split(/\\s+/);\n      var scored = [];\n      inventory.forEach(function(x){\n        var code = plain(x.code), text = code + ' ' + plain(x.description) + ' ' + plain(x.color) + ' ' + plain(x.category);\n        if (!words.every(function(w){ return text.indexOf(w) >= 0; })) return;\n        var score = code === q ? 0 : code.indexOf(q) === 0 ? 1 : code.indexOf(q) >= 0 ? 2 : 3;\n        scored.push({x: x, s: score});\n      });\n      scored.sort(function(a, b){ return a.s - b.s || String(a.x.code).localeCompare(String(b.x.code)); });\n      return scored.slice(0, 12).map(function(r){ return r.x; });\n    }\n    function place(){\n      if (!input) return;\n      var card = input.closest('.product-card') || input, r = card.getBoundingClientRect(), ir = input.getBoundingClientRect();\n      box.style.left = (r.left + window.scrollX) + 'px';\n      box.style.top = (ir.bottom + window.scrollY + 6) + 'px';\n      box.style.width = r.width + 'px';\n    }\n    function close(){ box.hidden = true; hits = []; active = -1; }\n    function render(){\n      var q = plain(input.value).trim();\n      if (!q) return close();\n      hits = search(input.value);\n      if (!hits.length) {\n        box.innerHTML = '<div class=\"cs-empty\">' + (inventory.length\n          ? 'Ningún producto coincide con “' + escH(input.value.trim()) + '”. Puedes escribir la descripción y el precio a mano.'\n          : 'El inventario de la app está vacío. Carga tus productos en la pestaña Inventario para buscarlos aquí.') + '<\/div>';\n      } else {\n        box.innerHTML = hits.map(function(x, i){\n          var left = Number(x.quantity) - soldUnits(norm(x.code));\n          return '<button type=\"button\" role=\"option\" data-i=\"' + i + '\"' + (i === active ? ' class=\"on\"' : '') + '>'\n            + '<span class=\"cs-main\"><span class=\"cs-code\">' + mark(x.code, q) + '<\/span><span class=\"cs-desc\">' + mark([x.description, x.color].filter(Boolean).join(' · '), q) + '<\/span><\/span>'\n            + '<span class=\"cs-side\"><b>' + money(x.salePrice) + '<\/b><span class=\"' + (left <= 0 ? 'cs-out' : '') + '\">' + (left <= 0 ? 'sin existencias' : left + ' disp.') + '<\/span><\/span><\/button>';\n        }).join('');\n      }\n      box.hidden = false; place();\n    }\n    function pick(i){\n      var x = hits[i]; if (!x || !input) return;\n      var row = input.closest('.product-card'), c = norm(x.code);\n      row.querySelector('[data-field=\"code\"]').value = c;\n      row.querySelector('[data-field=\"description\"]').value = [x.description, x.color].filter(Boolean).join(' · ');\n      row.querySelector('[data-field=\"price\"]').value = Number(x.salePrice || 0).toFixed(2);\n      close(); updateTotal(); flash(row);\n      var left = Number(x.quantity) - soldUnits(c);\n      if (left <= 0) msg('⚠ ' + c + ' figura sin existencias en Inventario');\n      var q = row.querySelector('[data-field=\"quantity\"]'); q.focus(); try { q.select(); } catch(e){}\n    }\n    var list = document.getElementById('productList');\n    list.addEventListener('input', function(e){\n      if (!e.target.matches('[data-field=\"code\"]')) return;\n      input = e.target; active = 0; render();\n    });\n    list.addEventListener('focusin', function(e){\n      if (!e.target.matches('[data-field=\"code\"]')) return;\n      e.target.setAttribute('autocomplete', 'off');\n      e.target.placeholder = 'Escribe código o nombre';\n      if (!invLoaded || Date.now() - lastLoad > 60000) { lastLoad = Date.now(); loadInventory().then(function(){ if (input === e.target && !box.hidden) render(); }); }\n    });\n    list.addEventListener('focusout', function(e){\n      if (e.target.matches('[data-field=\"code\"]')) setTimeout(function(){ if (document.activeElement !== input) close(); }, 150);\n    });\n    list.addEventListener('keydown', function(e){\n      if (!e.target.matches('[data-field=\"code\"]') || box.hidden || !hits.length) return;\n      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {\n        e.preventDefault(); active = (active + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length; render();\n        var on = box.querySelector('.on'); if (on) on.scrollIntoView({block: 'nearest'});\n      } else if (e.key === 'Enter' && !e.ctrlKey) { e.preventDefault(); pick(active < 0 ? 0 : active); }\n      else if (e.key === 'Escape') { e.preventDefault(); close(); }\n    });\n    // pointerdown + preventDefault: el campo no pierde el foco antes de elegir\n    box.addEventListener('pointerdown', function(e){ var b = e.target.closest('button[data-i]'); if (!b) return; e.preventDefault(); pick(Number(b.dataset.i)); });\n    window.addEventListener('resize', function(){ if (!box.hidden) place(); });\n    window.addEventListener('scroll', function(){ if (!box.hidden) place(); }, true);\n  })();\n\n  /* ---------- Cierre de ventas ---------- */\n  var card = document.createElement('section');\n  card.className = 'close-card';\n  card.innerHTML = '<div class=\"cc-text\"><strong>Cierre de ventas<\/strong><small id=\"ccInfo\">Resumen del día, PDF ejecutivo y envío por WhatsApp<\/small><\/div><button type=\"button\" class=\"btn\" id=\"openClose\">Hacer cierre<\/button>';\n  // En computadora va en la columna derecha; en celular, arriba del formulario\n  var pcq = window.matchMedia('(min-width:1024px)');\n  function placeCard(){\n    var side = document.querySelector('.pc-side'), ss = document.getElementById('syncStatus');\n    if (pcq.matches && side) side.insertBefore(card, side.firstChild);\n    else ss.parentNode.insertBefore(card, ss.nextSibling);\n  }\n  placeCard(); if (pcq.addEventListener) pcq.addEventListener('change', placeCard);\n\n  var ov = document.createElement('div');\n  ov.className = 'cl-overlay'; ov.id = 'closeOverlay';\n  ov.innerHTML = '<div class=\"cl-box\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"clTitle\">' +\n    '<div class=\"cl-head\"><div><h2 id=\"clTitle\">Cierre de ventas<\/h2><small>Revisa el resumen, cierra el día y comparte el reporte.<\/small><\/div><button type=\"button\" class=\"cl-x\" id=\"clX\" aria-label=\"Cerrar\">×<\/button><\/div>' +\n    '<div class=\"cl-date\"><label>Fecha<input type=\"date\" id=\"clDate\"><\/label><span class=\"cl-state\" id=\"clState\">Cargando…<\/span><\/div>' +\n    '<div id=\"clBody\"><\/div>' +\n    '<div class=\"cl-actions\"><button type=\"button\" class=\"btn\" id=\"clDo\">Cerrar el día<\/button><button type=\"button\" class=\"btn subtle\" id=\"clPdf\">Descargar PDF<\/button><button type=\"button\" class=\"btn wa\" id=\"clWa\">Enviar por WhatsApp<\/button><\/div>' +\n    '<p class=\"cl-help\" id=\"clHelp\"><\/p><\/div>';\n  document.body.appendChild(ov);\n\n  var state = {date: today(), sales: [], closures: [], summary: null};\n  document.getElementById('clDate').value = state.date;\n  document.getElementById('openClose').addEventListener('click', openModal);\n  document.getElementById('clX').addEventListener('click', function(){ ov.classList.remove('show'); });\n  ov.addEventListener('click', function(e){ if (e.target === ov) ov.classList.remove('show'); });\n  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') ov.classList.remove('show'); });\n  document.getElementById('clDate').addEventListener('change', function(e){ state.date = e.target.value || today(); refresh(); });\n\n  async function fetchJSON(u){ var r = await fetch(u, {cache: 'no-store'}); if (!r.ok) throw Error(r.status); return r.json(); }\n  async function openModal(){ ov.classList.add('show'); document.getElementById('clHelp').textContent = ''; await refresh(true); }\n  async function refresh(reload){\n    if (reload || !state.sales.length) {\n      try { state.sales = (await fetchJSON('/api/sales')).sales || []; } catch(e){ state.sales = load(); }\n      try { state.closures = (await fetchJSON('/api/closures')).closures || []; } catch(e){ state.closures = []; }\n      if (!invLoaded) await loadInventory();\n    }\n    state.summary = summarize(state.date);\n    paint();\n  }\n\n  function hourOf(iso){ try { return Number(new Intl.DateTimeFormat('en-US', {timeZone: TZ, hour: 'numeric', hour12: false}).format(new Date(iso))) % 24; } catch(e){ return null; } }\n  function shiftDate(d, n){ var t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }\n  function summarize(d){\n    var all = state.sales, day = all.filter(function(s){ return s.date === d; });\n    var sum = function(a, f){ return a.reduce(function(n, x){ return n + (Number(f(x)) || 0); }, 0); };\n    var total = sum(day, function(s){ return s.amount; });\n    var paid = sum(day, function(s){ return s.paid != null ? s.paid : s.amount; });\n    var units = sum(day, function(s){ return sum(saleItems(s), function(i){ return i.quantity || 1; }); });\n    var byPay = {efectivo: 0, transferencia: 0, credito: 0};\n    day.forEach(function(s){ var k = byPay[s.paymentType] != null ? s.paymentType : 'efectivo'; byPay[k] += Number(s.amount) || 0; });\n    var prev = [], prevDays = 0;\n    for (var i = 1; i <= 7; i++) { var pd = shiftDate(d, -i); var v = sum(all.filter(function(s){ return s.date === pd; }), function(s){ return s.amount; }); prev.push(v); }\n    var avg7 = prev.reduce(function(a, b){ return a + b; }, 0) / 7;\n    var vsAvg = avg7 > 0 ? (total - avg7) / avg7 * 100 : null;\n    var prods = {};\n    day.forEach(function(s){ saleItems(s).forEach(function(it){ var k = norm(it.code) || String(it.description || '').trim().toLowerCase(); if (!k) return;\n      var p = prods[k] || (prods[k] = {name: it.description || it.code, code: norm(it.code), units: 0, revenue: 0});\n      p.units += Number(it.quantity) || 1; p.revenue += (Number(it.quantity) || 1) * (Number(it.price) || 0); }); });\n    var top = Object.keys(prods).map(function(k){ return prods[k]; }).sort(function(a, b){ return b.revenue - a.revenue; });\n    var hours = {};\n    day.forEach(function(s){ var h = s.created ? hourOf(s.created) : null; if (h != null) hours[h] = (hours[h] || 0) + (Number(s.amount) || 0); });\n    var credits = all.filter(function(s){ return s.paymentType === 'credito' && balance(s) > 0; });\n    var overdue = credits.filter(function(s){ return (s.dueDate || plusDays(s.date, 7)) < d; });\n    var stock = [];\n    top.forEach(function(p){ if (!p.code) return; var inv = inventory.find(function(x){ return norm(x.code) === p.code; }); if (!inv) return;\n      var sold = all.reduce(function(n, s){ return n + saleItems(s).filter(function(i){ return norm(i.code) === p.code; }).reduce(function(m, i){ return m + (Number(i.quantity) || 1); }, 0) pan><div class=\"brand-title\"><span class=\"eyebrow\">GALIA SHOP<\/span><h1>Inventario<\/h1><\/div><\/header><nav class=\"main-tabs\" aria-label=\"Módulos\"><a href=\"/registro.html\">Ventas<\/a><a class=\"active\" href=\"/inventario.html\" aria-current=\"page\">Inventario<\/a><a href=\"/analisis.html\">Análisis<\/a><\/nav><p class=\"intro\">Registra tus prendas y revisa cuáles se venden con frecuencia o llevan tiempo sin movimiento.<\/p><form class=\"panel\" id=\"form\"><div class=\"row\"><div class=\"field\"><label for=\"purchaseDate\">Fecha de compra<\/label><input id=\"purchaseDate\" type=\"date\" required><\/div><div class=\"field\"><label for=\"quantity\">Cantidad<\/label><input id=\"quantity\" type=\"number\" inputmode=\"numeric\" min=\"1\" step=\"1\" placeholder=\"1\" required><\/div><\/div><div class=\"field\"><label for=\"supplier\">Proveedor<\/label><input id=\"supplier\" placeholder=\"Nombre del proveedor\" required><\/div><div class=\"row\"><div class=\"field\"><label for=\"purchasePrice\">Precio de compra (USD)<\/label><input id=\"purchasePrice\" type=\"text\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"0.00\" required><\/div><div class=\"field\"><label for=\"salePrice\">Precio de venta (USD)<\/label><input id=\"salePrice\" type=\"text\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"0.00\" required><\/div><\/div><div class=\"row\"><div class=\"field\"><label for=\"category\">Categoría<\/label><input id=\"category\" list=\"categories\" placeholder=\"Ej. pantalón\" required><datalist id=\"categories\"><option value=\"Blusa\"><option value=\"Pantalón\"><option value=\"Vestido\"><option value=\"Conjunto\"><option value=\"Chaqueta\"><option value=\"Accesorio\"><\/datalist><\/div><div class=\"field\"><label for=\"color\">Color<\/label><input id=\"color\" placeholder=\"Ej. negro\" required><\/div><\/div><div class=\"field\"><label for=\"description\">Descripción<\/label><textarea id=\"description\" placeholder=\"Prenda, talla y detalles\" required><\/textarea><\/div><div class=\"field\"><label for=\"code\">Código del producto<\/label><div class=\"code-row\"><input id=\"code\" placeholder=\"Escanea o escribe el código\" autocomplete=\"off\" required><button class=\"scan-btn\" id=\"scan\" type=\"button\">Escanear<\/button><\/div><p class=\"help\">El lector físico escribe aquí automáticamente. Conserva el código de barras original; si no tiene uno, ingresa un código manual.<\/p><\/div><div class=\"field\"><label for=\"photo\">Foto del producto <span class=\"optional\">(opcional)<\/span><\/label><input id=\"photo\" type=\"file\" accept=\"image/jpeg,image/png,image/webp\" capture=\"environment\"><img id=\"photoPreview\" class=\"photo-preview\" alt=\"Vista previa del producto\"><p class=\"help\" id=\"photoStatus\">Toma una foto o elige una de tu galería.<\/p><\/div><div class=\"field\"><label for=\"lastSaleDate\">Fecha de la última venta <span class=\"optional\">(si hubo ventas anteriores)<\/span><\/label><input id=\"lastSaleDate\" type=\"date\"><\/div><button class=\"btn\" id=\"save\" type=\"submit\">Guardar prenda<\/button><\/form><details class=\"records\" id=\"records\"><summary><span class=\"summary-text\"><strong>Prendas registradas<\/strong><small id=\"count\">0 prendas<\/small><\/span><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"/><\/svg><\/summary><div class=\"records-content\"><p class=\"legend\"><span class=\"pink-text\">Rosa:<\/span> 90 días sin movimiento y con existencias. <span class=\"green-text\">Verde:<\/span> dos o más ventas distintas en los últimos 90 días.<\/p><div id=\"items\"><\/div><p class=\"sync\" id=\"syncStatus\" aria-live=\"polite\">Preparando inventario…<\/p><div class=\"note\">El archivo diario de inventario se guardará en <a href=\"https://drive.google.com/drive/folders/16Ujigmu41NZOLHtRo-8h1uifjLPhUd7r\" target=\"_blank\" rel=\"noopener\">Galia Shop / Inventario<\/a>. Las ventas sin código no podrán asociarse con una prenda.<\/div><button class=\"btn subtle\" id=\"export\" type=\"button\">Exportar inventario a Excel<\/button><\/div><\/details><\/main><div class=\"scanner\" id=\"scanner\"><div class=\"scanner-box\"><p>Apunta al código de barras<\/p><video id=\"scanVideo\" autoplay playsinline muted><\/video><button class=\"btn\" id=\"closeScan\" type=\"button\">Cerrar cámara<\/button><\/div><\/div><div role=\"status\" aria-live=\"polite\" class=\"toast\" id=\"toast\"><\/div><script>const key='galia-shop-inventory-v1',fields=['purchaseDate','quantity','supplier','purchasePrice','salePrice','category','color','description','code','lastSaleDate'];let editId=null,sales=[],syncTimer,photoKey=\"\",scanStream=null,scanActive=false;const $=id=>document.getElementById(id);const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Guayaquil',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('purchaseDate').value=today();function load(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function xml(s){return String(s??'').replace(/[<>&\"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','\"':'&quot;'}[c]))}function msg(s){let el=$('toast');el.textContent=s;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2700)}function code(s){return String(s||'').trim().toUpperCase()}function metrics(x){let linked=sales.flatMap(s=>(Array.isArray(s.items)&&s.items.length?s.items:[{code:s.code,quantity:1}]).map(i=>({code:i.code,quantity:Number(i.quantity)||1,date:s.date,saleId:s.id}))).filter(i=>code(i.code)===code(x.code));let cutoff=new Date(Date.parse(today()+'T00:00:00Z')-90*86400000).toISOString().slice(0,10),recentSales=new Set(linked.filter(i=>i.date>=cutoff).map(i=>i.sa sync');$('syncStatus').textContent='Inventario guardado en el sitio; exporta el Excel para subirlo a Drive'}catch{$('syncStatus').textContent='Sin conexión: abre Inventario con internet para guardar en el sitio'}}function persist(list){localStorage.setItem(key,JSON.stringify(list));$('syncStatus').textContent='Sincronizando inventario…';clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,500)}function parsePrice(value){let raw=String(value??'').trim().replace(',','.');return /^\\d+(?:\\.\\d{1,2})?$/.test(raw)?Number(raw):NaN}$('photo').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5000000){msg('Usa una foto JPG, PNG o WebP de hasta 5 MB');e.target.value='';return}let old=photoKey;$('save').disabled=true;$('photoStatus').textContent='Guardando foto…';let data=new FormData();data.append('photo',file);try{let r=await fetch('/api/inventory/photo',{method:'POST',body:data});let result=await r.json();if(!r.ok)throw Error(result.error||'No se pudo guardar la foto');photoKey=result.photoKey;$('photoPreview').src=blobUrl(photoKey);$('photoPreview').classList.add('visible');$('photoStatus').textContent='Foto lista para guardar con el producto';}catch(err){photoKey=old;$('photoStatus').textContent=err.message;msg(err.message)}finally{$('save').disabled=false}});\nfunction closeScanner(){scanActive=false;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}$('scanVideo').srcObject=null;$('scanner').classList.remove('active')}\n$('closeScan').addEventListener('click',closeScanner);\n$('scan').addEventListener('click',async()=>{if(!('BarcodeDetector' in window)||!navigator.mediaDevices?.getUserMedia){msg('Usa un lector físico o escribe el código manualmente');$('code').focus();return}try{let supported=await BarcodeDetector.getSupportedFormats();let formats=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','codabar','qr_code'].filter(f=>supported.includes(f));if(!formats.length)throw Error('Formato no compatible');let detector=new BarcodeDetector({formats});scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});let video=$('scanVideo');video.srcObject=scanStream;$('scanner').classList.add('active');scanActive=true;await video.play();while(scanActive){let found=await detector.detect(video).catch(()=>[]);if(found.length){$('code').value=found[0].rawValue;closeScanner();msg('Código leído');break}await new Promise(r=>setTimeout(r,180))}}catch{closeScanner();msg('No se pudo abrir la cámara. Escribe el código o usa un lector físico')}});\n$('form').addEventListener('submit',e=>{e.preventDefault();let list=load(),v=Object.fromEntries(fields.map(id=>[id,$(id).value.trim()]));v.code=v.code.trim();v.photoKey=photoKey;v.quantity=Number(v.quantity);v.purchasePrice=parsePrice(v.purchasePrice);v.salePrice=parsePrice(v.salePrice);if(!Number.isInteger(v.quantity)||v.quantity<1||!Number.isFinite(v.purchasePrice)||!Number.isFinite(v.salePrice))return msg('Revisa cantidad y precios');if(list.some(x=>code(x.code)===v.code&&x.id!==editId))return msg('Ese código ya está registrado');if(editId)list=list.map(x=>x.id===editId?{...x,...v}:x);else list.push({...v,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),created:new Date().toISOString()});persist(list);$('form').reset();$('purchaseDate').value=today();photoKey='';$('photoPreview').classList.remove('visible');$('photoPreview').removeAttribute('src');$('photoStatus').textContent='Toma una foto o elige una de tu galería.';editId=null;$('save').textContent='Guardar prenda';render();msg('Prenda guardada')});$('items').addEventListener('click',async e=>{let b=e.target.closest('button[data-action]');if(!b)return;let list=load(),x=list.find(v=>v.id===b.dataset.id);if(!x)return;if(b.dataset.action==='delete'){if(await galiaConfirm('¿Eliminar '+x.code+' del inventario?')){persist(list.filter(v=>v.id!==x.id));rende idth:100%;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee0e4}th{color:#815269}td.num{text-align:right;white-space:nowrap}.badge{color:#8b4a61;font-weight:700}.report{display:none}.rec-list{padding-left:21px;line-height:1.55}.rec-list li{margin-bottom:8px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.tabs a{font-size:14px}}@media print{body{background:white}.app{display:none}.report{display:block;font:12pt/1.4 Arial,sans-serif;color:#222;margin:18mm}.report h1{font:26pt Georgia,serif;color:#783e55}.report h2{font:17pt Georgia,serif;margin-top:25px}.report table{font-size:10pt}.report .report-note{font-size:10pt;color:#555}.report footer{margin-top:30px;border-top:1px solid #aaa;padding-top:10px;font-size:10pt}}\n<\/style><style id=\"galia-pc\">\n@media (min-width:1024px){\n  .app{max-width:1360px;padding:24px 32px 60px;display:grid;grid-template-columns:1fr 1fr;column-gap:22px;align-items:start}\n  .app>header{grid-column:1;grid-row:1}\n  .app>.tabs{grid-column:2;grid-row:1;align-self:center;margin:0}\n  .app>.tabs a{cursor:pointer}\n  .app>.tabs a:not(.active):hover{background:#f9edf1}\n  .app>.controls,.app>.status,.app>#metrics{grid-column:1 / -1}\n  .app>section.panel{margin:8px 0}\n  .app>section.panel:last-of-type{grid-column:1 / -1}\n  #metrics{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}\n  .table-wrap{max-height:420px;overflow:auto}\n  th{position:sticky;top:0;background:#fff}\n  tr:hover td{background:#fbf5f7}\n}\n<\/style>\n<\/head><body><main class=\"app\"><header><small>GALIA SHOP · GERENCIA<\/small><h1>Análisis para tomar decisiones<\/h1><\/header><nav class=\"tabs\"><a href=\"/registro.html\">Ventas<\/a><a href=\"/inventario.html\">Inventario<\/a><a class=\"active\" href=\"/analisis.html\" aria-current=\"page\">Análisis<\/a><\/nav><section class=\"panel controls\"><label>Fecha de análisis<input id=\"date\" type=\"date\"><\/label><button class=\"btn\" id=\"close\">Cerrar día<\/button><button class=\"btn secondary\" id=\"pdf\">Reporte PDF<\/button><\/section><p class=\"status\" id=\"status\" aria-live=\"polite\">Cargando datos…<\/p><div class=\"grid\" id=\"metrics\"><\/div><section class=\"panel\"><h2>Ventas diarias<\/h2><div class=\"table-wrap\" id=\"daily\"><\/div><\/section><section class=\"panel\"><h2>Productos estrella<\/h2><p class=\"hint\">Ordenados por ingresos. Se agrupan por código; sin código, por descripción.<\/p><div class=\"table-wrap\" id=\"stars\"><\/div><\/section><section class=\"panel\"><h2>Utilidad por producto<\/h2><p class=\"hint\">Utilidad bruta estimada = venta menos costo de compra. No incluye arriendo, transporte, comisiones ni otros gastos. El costo se busca por código en Inventario.<\/p><div class=\"table-wrap\" id=\"profit\"><\/div><\/section><section class=\"panel\"><h2>Recomendaciones para vender más<\/h2><ol id=\"recommendations\" class=\"rec-list\"><\/ol><\/section><section class=\"panel\"><h2>Cierres diarios<\/h2><div id=\"closures\" class=\"hint\">Cargando…<\/div><\/section><\/main><article class=\"report\" id=\"report\"><\/article><script>\nconst $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Guayaquil',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('date').value=today();let sales=[],inventory=[],closures=[];const items=x=>Array.isArray(x.items)&&x.items.length?x.items:[{description:x.description||'Producto',code:x.code||'',quantity:1,price:Number(x.amount)||0}];function data(){let date=$('date').value,day=sales.filter(x=>x.date===date),inv=new Map(inventory.map(x=>[String(x.code||'').trim().toUpperCase(),x])),map=new Map();for(let x of day)for(let item of items(x)){let code=String(item.code||'').trim().toUpperCase(),key=code||String(item.description||'').trim().toLowerCase(),quantity=Number(item.quantity)||1,revenue=Math.round(quantity*Number(item.price||0)*100)/100,cost=code?inv.get(code):null,v=map.get(key)||{label:item.description||code,code,quantity:0,revenue:0,profit:0,known:0,unknown:0};v.quantity+=quantity;v.revenue+=revenue;if(cost&&Number.isFinite(Number(cost.purchasePrice))){v.profit+=revenue-quantity*Number(cost.purchasePrice);v.known+=quantity}else v.unknown+=quantity;map.set(key,v)}let products=[...map.values()].sort((a,b)=>b.revenue-a.revenue);let revenue=day.reduce((n,x)=>n+Number(x.amount||0),0),paid=day.reduce((n,x)=>n+Number(x.paid??x.amount??0),0),credit=day.filter(x=>x.paymentType==='credito');return{date,day,products,revenue,paid,credit,pending:Math.max(0,revenue-paid)}}function table(headers,rows){return '<table><thead><tr>'+headers.map(h=>'<th>'+h+'<\/th>').join('')+'<\/tr><\/thead><tbody>'+rows.map(row=>'<tr>'+row.map((v,i)=>'<td'+(i?' class=\"num\"':'')+'>'+v+'<\/td>').join('')+'<\/tr>').join('')+'<\/tbody><\/table>'}function recommendations(d){let out=[];if(!d.day.length)return ['Publica tres prendas disponibles con talla, precio y una invitación a escribir por WhatsApp.','Registra cada venta y su código para identificar los productos que más rotan.'];if(d.products[0])out.push('Destaca '+d.products[0].label+' en historias y exhibición: generó '+money(d.products[0].revenue)+' en la fecha seleccionada.');if(d.products.some(x=>x.unknown))out.push('Completa el código y precio de compra en Inventario para medir la utilidad de todos los productos.');if(d.pending>0)out.push('Da seguimiento a los créditos con saldo pendiente de '+money(d.pending)+' y registra cada abono.');if(d.day.length<3)out.push('Contacta a clientas interesadas y publica combinaciones de prendas con disponibilidad real para aumentar las ventas del próximo día.');else out.push('Prueba una oferta complementaria con accesorios para elevar el valor de cada compra.');return out}function render(){const d=data(),closed=closures.find(x=>x.date===d.date);$('metrics').innerHTML=[['Ventas',d.day.length],['Ingresos por ventas',money(d.revenue)],['Cobrado',money(d.paid)],['Saldo crédito',money(d.pending)]].map(([k,v])=>`<div class=\"metric\"><small>${k}<\/small><strong>${v}<\/strong><\/div>`).join('');$('daily').innerHTML=table(['Fecha','Ventas','Total'],[...new Set(sales.map(x=>x.date))].sort().reverse().slice(0,31).map(date=>{let list=sales.filter(x=>x.date===date);return[esc(date),list.length,money(list.reduce((n,x)=>n+Number(x.amount||0),0))]}));$('stars').innerHTML=d.products.length?table(['Producto','Unidades','Ventas'],d.products.slice(0,10).map(x=>[esc(x.label)+(x.code?' · '+esc(x.code):''),x.quantity,money(x.revenue)])):'No hay productos vendidos en esta fecha.';$('profit').innerHTML=d.products.length?table(['Producto','Unidades con costo','Utilidad bruta estimada'],d.products.map(x=>[esc(x.label),x.known,x.known?money(x.profit)+(x.unknown?' · '+x.unknown+' sin costo':''):'Costo no registrado'])):'No hay ventas en esta fecha.';$('recommendations').innerHTML=recommendations(d).map(s=>'<li>'+esc(s)+'<\/li>').join('');$('closures').innerHTML=closures.length?table(['Fecha','Ventas','Total','Cobrado','Pendiente'],closures.slice(0,30).map(x=>[esc(x.date),x.count,money(x.amount),money(x.paid),money(x.pending)])):'Aún no hay cierres.';$('close').disabled=!!closed||!d.day.length;$('close').textContent=closed?'Día cerrado':'Cerrar día';$('status').textContent=closed?'Cierre del '+d.date+' guardado. Es una fotografía de las ventas en el momento del cierre.':d.day.length?'Revisa las cifras y pulsa “Cerrar día” para guardar el resultado.':'No hay ventas registradas para '+d.date+'.';return d}async function load(){try{let responses=await Promise.all(['/api/sales','/api/inventory','/api/closures'].map(url=>fetch(url,{cache:'no-store'})));if(responses.some(r=>!r.ok))throw Error('No se pudieron cargar los datos. Inicia sesión e inténtalo de nuevo.');let [a,b,c]=await Promise.all(responses.map(r=>r.json()));sales=a.sales||[];inventory=b.inventory||[];closures=c.closures||[];render()}catch(e){$('status').textContent=e.message}}$('date').addEventListener('change',render);$('close').addEventListener('click',async()=>{let d=data();if(!d.day.length)return;if(!await galiaConfirm('¿Cerrar el '+d.date+' con '+d.day.length+' ventas y '+money(d.revenue)+'? El cierre guardará estas cifras.'))return;try{let r=await fetch('/api/closures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:d.date})});if(!r.ok)throw Error('No se pudo guardar el cierre');let result=await r.json();closures=[result.closure,...closures.filter(x=>x.date!==d.date)];render()}catch(e){$('status').textContent=e.message}});$('pdf').addEventListener('click',()=>{let d=data(),closed=closures.find(x=>x.date===d.date),profitKnown=d.products.reduce((n,x)=>n+x.profit,0),unknown=d.products.reduce((n,x)=>n+x.unknown,0);$('report').innerHTML=`<h1>Galia Shop · Reporte a gerencia<\/h1><p>Fecha: ${esc(d.date)} · ${closed?'Cierre guardado el '+esc(closed.createdAt.slice(0,10)):'Reporte previo al cierre'}<\/p><h2>Resumen diario<\/h2><p>${d.day.length} ventas · Total ${money(d.revenue)} · Cobrado ${money(d.paid)} · Saldo pendiente ${money(d.pending)}<\/p><p>Utilidad bruta estimada de productos con costo: ${money(profitKnown)}${unknown?' · '+unknown+' unidades sin costo registrado':''}.<\/p><p class=\"report-note\">El total de ventas no equivale al dinero cobrado. La utilidad no incluye gastos operativos; los productos sin costo se excluyen de su cálculo.<\/p><h2>Productos estrella<\/h2>${table(['Producto','Unidades','Ventas'],d.products.slice(0,10).map(x=>[esc(x.label),x.quantity,money(x.revenue)]))}<h2>Utilidad por producto<\/h2>${table(['Producto','Utilidad estimada'],d.products.map(x=>[esc(x.label),x.known?money(x.profit)+(x.unknown?' (parcial)':''):'Sin costo registrado']))}<h2>Recomendaciones<\/h2><ol>${recommendations(d).map(x=>'<li>'+esc(x)+'<\/li>').join('')}<\/ol><footer>Reporte generado para la gerencia de Galia Shop. Guarda como PDF desde la ventana de impresión.<\/footer>`;window.print()});load();\n<\/script><style>\n.cx-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin:8px 0}\n.cx-panel{min-width:0;overflow-x:auto}\n.cx-alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:16px;padding:14px 16px;margin:8px 0;border:1px solid}\n.cx-alert.remind{background:#fff6e6;border-color:#f0d9a8;color:#6b4a10}\n.cx-alert.bday{background:#fdeef4;border-color:#efc3d4;color:#7a2e4d}\n.cx-alert b{font-weight:700}\n.cx-alert .cx-btns{display:flex;gap:8px;flex-wrap:wrap}\n.cx-panel{background:#fff;border:1px solid #eadce1;border-radius:18px;padding:20px;box-shadow:0 6px 22px #50313b0a}\n.cx-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}\n.cx-head h2{margin:0}\n.cx-sub{color:#75636b;font-size:13.5px;margin:2px 0 0}\n.cx-seg{display:inline-flex;background:#f3e5ea;border-radius:11px;padding:3px}\n.cx-seg button{border:0;background:none;padding:8px 12px;border-radius:9px;font:600 13px inherit;font-family:inherit;color:#763c55;cursor:pointer}\n.cx-seg button.on{background:#a8617b;color:#fff}\n.cx-nav{display:flex;align-items:center;gap:6px}\n.cx-nav button{border:1px solid #dec6cf;background:#fff;color:#763c55;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:16px}\n.cx-table{width:100%;border-collapse:collapse;font-size:14px}\n.cx-table th,.cx-table td{padding:9px 8px;border-bottom:1px solid #eee0e4;text-align:left}\n.cx-table th{color:#815269;font-size:12.5px}\n.cx-table td.num{text-align:right;white-space:nowrap}\n.cx-rank{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;background:#f3e5ea;color:#8c4c65;font-weight:700;font-size:12px}\n.cx-rank.gold{background:#a8617b;color:#fff}\n.cx-name{font-weight:650}.cx-meta{display:block;color:#806a73;font-size:12px}\n.cx-bar{height:5px;background:#f1e3e8;bo         body: JSON.stringify({clave: claveUsar != null ? claveUsar : clave(), accion: accion, datos: datos || {}})});
    } catch(e) { throw {code: 'red', message: 'Sin conexión a internet'}; }
    if (!r.ok) throw {code: 'red', message: 'El servidor no respondió (' + r.status + ')'};
    var j;
    try { j = await r.json(); } catch(e) { throw {code: 'servidor', message: 'Respuesta inválida del servidor. Revisa la URL en config.js.'}; }
    if (j && j.error) throw {code: j.error, message: j.mensaje || j.error};
    return j;
  }
  window.galiaLlamar = llamar;

  /* ---------- Pantalla de acceso ---------- */
  var css = document.createElement('style');
  css.textContent = '#gLogin{position:fixed;inset:0;z-index:100;background:#efe4dc;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2b1f24}'
    + '#gLogin .card{width:min(100%,360px);background:#f7f1ec;border:1px solid #ead9df;border-radius:22px;padding:28px 24px;box-shadow:0 18px 44px #54313b1f;text-align:center}'
    + '#gLogin .glogo{mix-blend-mode:multiply;width:190px;height:93px;margin:0 auto 6px;background:url(brand-lookbook.png) -14px -3px / 850px 680px no-repeat}#gLogin img{width:190px;max-width:80%;margin:0 auto 6px;display:block}'
    + '#gLogin h1{font:500 21px Georgia,serif;margin:6px 0 4px}#gLogin p{color:#76666c;font-size:14px;line-height:1.45;margin:0 0 18px}'
    + '#gLogin input{width:100%;background:#fff;box-sizing:border-box;min-height:50px;border:1px solid #ddcdd2;border-radius:13px;padding:12px 14px;font:inherit;font-size:17px;text-align:center;outline:none}'
    + '#gLogin input:focus{border-color:#ad6880;box-shadow:0 0 0 3px #eecfda}'
    + '#gLogin button{width:100%;margin-top:12px;min-height:52px;border:0;border-radius:13px;background:#ad6880;color:#fff;font-family:inherit;font-weight:600;font-size:16px;cursor:pointer}'
    + '#gLogin button:disabled{opacity:.6}#gLogin .err{color:#a1452f;font-size:14px;min-height:20px;margin-top:12px}'
    + '#gLogin small{display:block;margin-top:14px;color:#9a8a90;font-size:12px}';
  document.head.appendChild(css);

  function mostrarLogin(aviso, alEntrar){
    var boot = document.getElementById('boot'); if (boot) boot.style.display = 'none';
    var o = document.getElementById('gLogin'); if (o) o.remove();
    o = document.createElement('div'); o.id = 'gLogin';
    o.innerHTML = '<form class="card"><div class="glogo" role="img" aria-label="Galia Shop"></div><h1>Bienvenida</h1>'
      + '<p>Escribe la clave del negocio para entrar. Solo se pide una vez en cada dispositivo.</p>'
      + '<input type="password" id="gClave" autocomplete="current-password" placeholder="Clave del negocio" required>'
      + '<button type="submit" id="gEntrar">Entrar</button><div class="err" id="gErr"></div>'
      + '<small>¿No tienes la clave? Pídela a la administración de Galia Shop.</small></form>';
    document.body.appendChild(o);
    var err = o.querySelector('#gErr'), btn = o.querySelector('#gEntrar'), inp = o.querySelector('#gClave');
    err.textContent = aviso || '';
    setTimeout(function(){ inp.focus(); }, 50);
    o.querySelector('form').addEventListener('submit', async function(e){
      e.preventDefault();
      var v = inp.value.trim(); if (!v) return;
      btn.disabled = true; btn.textContent = 'Verificando…'; err.textContent = '';
      try {
        await llamar('ping', {}, v);
        guardarClave(v); o.remove();
        if (alEntrar) alEntrar(); else location.reload();
      } catch(x) {
        err.textContent = x.code === 'clave' ? 'Clave incorrecta. Inténtalo de nuevo.' : (x.message || 'No se pudo conectar.');
        btn.disabled = false; btn.textContent = 'Entrar'; inp.select();
      }
    });
  }

  window.GALIA_WAIT = 1;
  window.GALIA_GATE = function(start){
    if (!API || /PEGA-AQUI/.test(API)) {
      var b = document.getElementById('boot');
      if (b) b.innerHTML = '<b>GALIA SHOP</b><span style="max-width:320px;text-align:center;line-height:1.5">Falta configurar la dirección del servidor en el archivo <b>config.js</b>.</span>';
      return;
    }
    if (clave()) start(); else mostrarLogin('', start);
  };
  // Fotos de inventario guardadas en Drive
  window.GALIA_BLOB = function(id){ return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w1000'; };

  window.galiaSalir = function(){ guardarClave(''); location.reload(); };
  window.galiaMostrarLogin = mostrarLogin;
})();

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('galia-data').textContent);
  var frames = document.getElementById('frames');
  var current = null;

  /* ---------- capacidades de Claude ---------- */
  function use(name){
    try { return (window.claude && window.claude.use) ? window.claude.use(name).catch(function(){return null}) : null; }
    catch(e){ return null; }
  }
  // window.claude aparece después del primer arranque: esperamos hasta 12 s
  function waitUse(name){
    return new Promise(function(res){
      var t0 = Date.now();
      (function tick(){
        if (window.claude && window.claude.use) { use(name).then(res); return; }
        if (Date.now() - t0 > (window.GALIA_WAIT || 12000)) return res(null);
        setTimeout(tick, 100);
      })();
    });
  }
  var dbP = waitUse('db');
  var assetsP = null;
  function getAssets(){ return assetsP || (assetsP = waitUse('assets')); }

  /* ---------- utilidades ---------- */
  function json(obj, status){
    return new Response(JSON.stringify(obj), {status: status || 200, headers: {'Content-Type': 'application/json'}});
  }
  function body(o){
    try { return typeof o.body === 'string' ? JSON.parse(o.body) : null; } catch(e){ return null; }
  }
  function key(id){ return 's_' + String(id).replace(/[^A-Za-z0-9_-]/g, '_'); }
  function dayOf(sale){ var d = String(sale.date || ''); return /^\d{4}-\d{2}-\d{2}/.test(d) ? d.slice(0,10) : 'sin-fecha'; }
  function same(a, b){ return JSON.stringify(a) === JSON.stringify(b); }

  // Ventas: un documento por día -> { s_<id>: venta, ... }
  async function readSales(db){
    var snap = await db.collection('sales').get();
    var list = [], where = {};
    snap.docs.forEach(function(d){
      var data = d.data() || {};
      Object.keys(data).forEach(function(k){
        var v = data[k];
        if (v && typeof v === 'object' && typeof v.id === 'string') { list.push(v); where[v.id] = {day: d.id, k: k, v: v}; }
      });
    });
    list.sort(function(a,b){ return String(b.date||'').localeCompare(String(a.date||'')); });
    return {list: list, where: where, days: snap.docs.reduce(function(m,d){ m[d.id] = true; return m; }, {})};
  }
  async function patchDay(db, day, patch, exists){
    var ref = db.doc('sales/' + day);
    if (exists) { try { await ref.update(patch); return; } catch(e){ /* cae a set */ } }
    var cur = (await ref.get()); var base = cur.exists ? (cur.data() || {}) : {};
    Object.keys(patch).forEach(function(k){ if (patch[k] === null) delete base[k]; else base[k] = patch[k]; });
    await ref.set(base);
  }

  async function readAll(db, coll){
    var snap = await db.collection(coll).get();
    return snap.docs.map(function(d){ return {id: d.id, data: d.data() || {}}; });
  }

  // Copia de respaldo en Google Drive (solo si la versión la tiene configurada)
  async function driveSync(db){
    if (!window.GALIA_DRIVE_SEND) return 'unconfigured';
    try {
      var sales = (await readSales(db)).list;
      var inventory = (await readAll(db, 'inventory')).map(function(r){ var x = Object.assign({}, r.data); delete x._u; return x; });
      var closures = (await readAll(db, 'closures')).map(function(r){ return r.data; });
      return await window.GALIA_DRIVE_SEND({sales: sales, inventory: inventory, closures: closures});
    } catch(e) { console.warn('[galia] drive', e); return 'failed'; }
  }

  /* ---------- API que antes estaba en el servidor ---------- */
  window.galiaApi = async function(url, o){
    var method = String(o.method || 'GET').toUpperCase();
    var path = url.split('?')[0];
    var db = await dbP;
    if (!db) return json({error: 'Acceso no autorizado'}, 401);
    try {
      if (path === '/api/sales') {
        if (method === 'GET') { var r = await readSales(db); return json({sales: r.list}); }
        if (method === 'POST') {
          var b = body(o);
          if (!b || !Array.isArray(b.sales) || b.sales.length > 5000) return json({error: 'Datos inválidos'}, 400);
          if (b.sales.some(function(x){ return !x || typeof x.id !== 'string' || typeof x.date !== 'string' || typeof x.client !== 'string' || typeof x.amount !== 'number'; }))
            return json({error: 'Venta inválida'}, 400);
          var cur = await readSales(db), patches = {};
          b.sales.forEach(function(x){
            var day = dayOf(x), k = key(x.id), old = cur.where[x.id];
            if (old && old.day === day && same(old.v, x)) return;
            if (old && old.day !== day) (patches[old.day] = patches[old.day] || {})[old.k] = null;
            (patches[day] = patches[day] || {})[k] = x;
          });
          for (var d in patches) await patchDay(db, d, patches[d], !!cur.days[d]);
          return json({saved: b.sales.length, drive: await driveSync(db)});
        }
        if (method === 'DELETE') {
          var bd = body(o);
          if (!bd || typeof bd.id !== 'string' || !bd.id) return json({error: 'Venta inválida'}, 400);
          var c2 = await readSales(db), hit = c2.where[bd.id];
          if (hit) { var p = {}; p[hit.k] = null; await patchDay(db, hit.day, p, true); }
          return json({deleted: true, drive: await driveSync(db)});
        }
      }
      if (path === '/api/settings') {
        var sref = db.doc('settings/clientes');
        if (method === 'GET') { var sd = await sref.get(); return json({settings: sd.exists ? (sd.data() || {}) : {}}); }
        if (method === 'POST') {
          var bs = body(o);
          if (!bs || typeof bs.settings !== 'object' || Array.isArray(bs.settings)) return json({error: 'Datos inválidos'}, 400);
          if (JSON.stringify(bs.settings).length > 200000) return json({error: 'Demasiados datos'}, 400);
          await sref.set(bs.settings);
          return json({saved: true});
        }
      }
      if (path === '/api/drive-sync') return json({drive: await driveSync(db)});
      if (path === '/api/inventory') {
        if (method === 'GET') {
          var inv = await readAll(db, 'inventory');
          inv.sort(function(a,b){ return String(b.data._u||'').localeCompare(String(a.data._u||'')); });
          return json({inventory: inv.map(function(r){ var x = Object.assign({}, r.data); delete x._u; return x; })});
        }
        if (method === 'POST') {
          var bi = body(o);
          if (!bi || !Array.isArray(bi.inventory) || bi.inventory.length > 5000) return json({error: 'Datos inválidos'}, 400);
          var items = bi.inventory;
          if (items.some(function(x){ return !x || typeof x.id !== 'string' || typeof x.code !== 'string' || typeof x.purchaseDate !== 'string' || typeof x.quantity !== 'number' || typeof x.purchasePrice !== 'number' || typeof x.salePrice !== 'number'; }))
            return json({error: 'Prenda inválida'}, 400);
          var codes = items.map(function(x){ return String(x.code).trim().toUpperCase(); });
          if (new Set(codes).size !== codes.length) return json({error: 'Hay códigos repetidos'}, 400);
          var existing = await readAll(db, 'inventory'), have = {};
          existing.forEach(function(r){ have[r.id] = r.data; });
          var now = new Date().toISOString(), keep = {};
          var jobs = [];
          for (var i = 0; i < items.length; i++) {
            (function(x){
              var id = key(x.id); keep[id] = true;
              var prev = have[id];
              if (prev) { var pc = Object.assign({}, prev); delete pc._u; if (same(pc, x)) return; }
              jobs.push(function(){ return db.doc('inventory/' + id).set(Object.assign({}, x, {_u: now})); });
            })(items[i]);
          }
          for (var eid in have) if (!keep[eid]) (function(e){ jobs.push(function(){ return db.doc('inventory/' + e).delete(); }); })(eid);
          // de 20 en 20 para que una carga grande (p. ej. un Excel) sea rápida
          for (var j = 0; j < jobs.length; j += 20) await Promise.all(jobs.slice(j, j + 20).map(function(f){ return f(); }));
          driveSync(db);
          return json({saved: items.length});
        }
      }
      if (path === '/api/inventory/photo' && method === 'POST') {
        var file = o.body && o.body.get ? o.body.get('photo') : null;
        var okTypes = {'image/jpeg':1, 'image/png':1, 'image/webp':1};
        if (!file || !okTypes[file.type] || file.size > 5000000 || file.size === 0)
          return json({error: 'Elige una foto JPG, PNG o WebP de hasta 5 MB'}, 400);
        var assets = await getAssets();
        if (!assets) return json({error: 'No tienes permiso para subir fotos en Galia Shop'}, 403);
        try { var up = await assets.upload(file); return json({photoKey: up.id}); }
        catch(e){ return json({error: 'No se pudo guardar la foto'}, 503); }
      }
      if (path === '/api/closures') {
        if (method === 'GET') {
          var cl = await readAll(db, 'closures');
          cl.sort(function(a,b){ return String(b.data.date||'').localeCompare(String(a.data.date||'')); });
          return json({closures: cl.map(function(r){ return r.data; })});
        }
        if (method === 'POST') {
          var bc = body(o);
          if (!bc || typeof bc.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(bc.date)) return json({error: 'Fecha inválida'}, 400);
          var ref = db.doc('closures/' + bc.date), ex = await ref.get();
          if (ex.exists) return json({closure: ex.data(), alreadyClosed: true});
          var all = (await readSales(db)).list.filter(function(x){ return x.date === bc.date; });
          var amount = Math.round(all.reduce(function(n,x){ return n + Number(x.amount||0); }, 0)*100)/100;
          var paid = Math.round(all.reduce(function(n,x){ return n + Number(x.paid != null ? x.paid : (x.amount || 0)); }, 0)*100)/100;
          var closure = {date: bc.date, createdAt: new Date().toISOString(), saleIds: all.map(function(x){ return x.id; }), count: all.length, amount: amount, paid: paid, pending: Math.max(0, Math.round((amount-paid)*100)/100)};
          await ref.set(closure);
          driveSync(db);
          return json({closure: closure, alreadyClosed: false});
        }
      }
      return json({error: 'No encontrado'}, 404);
    } catch(e) {
      console.error('[galia]', e);
      var code = e && e.code;
      if (code === 'not_granted') return json({error: 'Tu acceso es solo de lectura. Pide al administrador permiso para editar.'}, 403);
      if (code === 'quota_exceeded') return json({error: 'Se llenó el espacio de datos. Descarga un respaldo y avisa al administrador.'}, 507);
      return json({error: 'No se pudo conectar. Inténtalo de nuevo.'}, 503);
    }
  };
  var dlP = null;
  window.galiaSave = async function(blob, name){
    var dl = await (dlP || (dlP = waitUse('downloads')));
    if (!dl) return;
    try { await dl.save({filename: name, data: blob}); } catch(e) { console.warn('[galia] descarga', e && e.code); }
  };
  window.galiaBlob = window.GALIA_BLOB || function(id){ return new URL('/_blob/' + encodeURIComponent(id), location.href).href; };

  /* ---------- pantallas ---------- */
  function build(name){
    var html = DATA.pages[name];
    var inject = '<script>' + DATA.shim + '<\/script>';
    html = html.replace(/<head([^>]*)>/i, function(m){ return m + inject; });
    var f = document.createElement('iframe');
    f.title = 'Galia Shop · ' + name;
    f.setAttribute('allow', 'camera; clipboard-write; web-share');
    f.srcdoc = html;
    return f;
  }
  window.galiaShow = function(name){
    if (!DATA.pages[name]) name = 'registro';
    var f = build(name);
    frames.appendChild(f);
    f.addEventListener('load', function(){
      document.getElementById('boot').style.display = 'none';
      if (current && current !== f) current.remove();
      current = f;
      try { f.contentWindow.focus(); } catch(e){}
    }, {once: true});
    try { history.replaceState(null, '', '#' + name); } catch(e){}
  };
  function startApp(){
    var start = (location.hash || '').slice(1);
    galiaShow(DATA.pages[start] ? start : 'registro');
  }
  if (window.GALIA_GATE) window.GALIA_GATE(startApp); else startApp();
})();
</script>
<script>
/* Galia Shop · Reemplaza la API interna (que en Claude usaba su base de datos) por llamadas al Apps Script. */
(function(){
  var llamar = window.galiaLlamar;
  function json(obj, status){ return new Response(JSON.stringify(obj), {status: status || 200, headers: {'Content-Type': 'application/json'}}); }
  function body(o){ try { return typeof o.body === 'string' ? JSON.parse(o.body) : null; } catch(e){ return null; } }
  function r2(n){ return Math.round((Number(n) || 0) * 100) / 100; }

  async function comprimir(file){
    try {
      var img = await createImageBitmap(file), s = Math.min(1, 1600 / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); if (img.close) img.close();
      return await new Promise(function(res){ c.toBlob(function(b){ res(b || file); }, 'image/jpeg', 0.8); });
    } catch(e) { return file; }
  }
  function base64(blob){
    return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ res(String(fr.result).split(',')[1]); }; fr.onerror = rej; fr.readAsDataURL(blob); });
  }

  window.galiaApi = async function(url, o){
    var method = String((o && o.method) || 'GET').toUpperCase(), path = url.split('?')[0];
    o = o || {};
    try {
      if (path === '/api/sales') {
        if (method === 'GET') return json(await llamar('ventas.listar'));
        if (method === 'POST') { var b = body(o); if (!b || !Array.isArray(b.sales)) return json({error: 'Datos inválidos'}, 400); return json(await llamar('ventas.guardar', {sales: b.sales})); }
        if (method === 'DELETE') { var bd = body(o); if (!bd || !bd.id) return json({error: 'Venta inválida'}, 400); return json(await llamar('ventas.borrar', {id: bd.id})); }
      }
      if (path === '/api/drive-sync') return json({drive: 'synced'});
      if (path === '/api/inventory') {
        if (method === 'GET') return json(await llamar('inventario.listar'));
        if (method === 'POST') { var bi = body(o); if (!bi || !Array.isArray(bi.inventory)) return json({error: 'Datos inválidos'}, 400); return json(await llamar('inventario.guardar', {inventory: bi.inventory})); }
      }
      if (path === '/api/inventory/photo' && method === 'POST') {
        var file = o.body && o.body.get ? o.body.get('photo') : null;
        var ok = {'image/jpeg': 1, 'image/png': 1, 'image/webp': 1};
        if (!file || !ok[file.type] || file.size > 15000000 || !file.size) return json({error: 'Elige una foto JPG, PNG o WebP'}, 400);
        var small = await comprimir(file);
        return json(await llamar('foto.subir', {base64: await base64(small), type: small.type || 'image/jpeg'}));
      }
      if (path === '/api/settings') {
        if (method === 'GET') return json(await llamar('ajustes.leer'));
        if (method === 'POST') { var bs = body(o); if (!bs || typeof bs.settings !== 'object') return json({error: 'Datos inválidos'}, 400); return json(await llamar('ajustes.guardar', {settings: bs.settings})); }
      }
      if (path === '/api/closures') {
        if (method === 'GET') { var cl = (await llamar('cierres.listar')).closures || []; cl.sort(function(a, b){ return String(b.date || '').localeCompare(String(a.date || '')); }); return json({closures: cl}); }
        if (method === 'POST') {
          var bc = body(o);
          if (!bc || !/^\d{4}-\d{2}-\d{2}$/.test(String(bc.date || ''))) return json({error: 'Fecha inválida'}, 400);
          var all = ((await llamar('ventas.listar')).sales || []).filter(function(x){ return x.date === bc.date; });
          var amount = r2(all.reduce(function(n, x){ return n + Number(x.amount || 0); }, 0));
          var paid = r2(all.reduce(function(n, x){ return n + Number(x.paid != null ? x.paid : (x.amount || 0)); }, 0));
          var closure = {date: bc.date, createdAt: new Date().toISOString(), saleIds: all.map(function(x){ return x.id; }), count: all.length, amount: amount, paid: paid, pending: Math.max(0, r2(amount - paid))};
          return json(await llamar('cierres.crear', {closure: closure}));
        }
      }
      return json({error: 'No encontrado'}, 404);
    } catch(e) {
      console.warn('[galia]', e);
      if (e && e.code === 'clave') { try { localStorage.removeItem('galia-clave'); } catch(_){} window.galiaMostrarLogin('La clave cambió. Escribe la nueva clave.'); return json({error: 'Clave incorrecta'}, 401); }
      if (e && e.code === 'red') return json({error: 'Sin conexión. Inténtalo de nuevo.'}, 503);
      return json({error: (e && e.message) || 'No se pudo guardar. Inténtalo de nuevo.'}, 503);
    }
  };

  window.galiaSave = async function(blob, name){
    var a = document.createElement('a'), u = URL.createObjectURL(blob);
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 30000);
  };
})();
</script>
