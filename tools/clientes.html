<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes · Galia Shop</title><style>

<script>
(function(){
'use strict';
var TZ = 'America/Guayaquil';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var money = function(n){ return '$' + (Number(n) || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); };
var r2 = function(n){ return Math.round((Number(n) || 0) * 100) / 100; };
var today = function(){ return new Intl.DateTimeFormat('en-CA', {timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date()); };
var addDays = function(d, n){ var t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
var diffDays = function(a, b){ return Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 86400000); };
var fmt = function(d, o){ if (!/^\d{4}-\d{2}-\d{2}/.test(d || '')) return d || '—'; try { return new Intl.DateTimeFormat('es-EC', Object.assign({timeZone: 'UTC'}, o || {day: 'numeric', month: 'short'})).format(new Date(d.slice(0, 10) + 'T12:00:00Z')); } catch(_){ return d; } };
var fmtY = function(d){ return fmt(d, {day: 'numeric', month: 'short', year: 'numeric'}); };
var norm = function(s){ return String(s || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' '); };
var digits = function(s){ return String(s || '').replace(/\D/g, ''); };
var phoneKey = function(p){ var d = digits(p); return d.length >= 7 ? d.slice(-9) : ''; };
var first = function(n){ var f = String(n || '').trim().split(/\s+/)[0] || ''; return f ? f.charAt(0).toUpperCase() + f.slice(1).toLowerCase() : ''; };
var uid = function(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).slice(0, 13); };
var plural = function(n, s, p){ return n + ' ' + (n === 1 ? s : (p || s + 's')); };
function me(){ try { return (window.parent && window.parent.galiaUsuario && window.parent.galiaUsuario()) || ''; } catch(_){ return ''; } }
function confirmBox(t){ return window.galiaConfirm ? window.galiaConfirm(t) : Promise.resolve(confirm(t)); }
function promptBox(t){ return window.galiaPrompt ? window.galiaPrompt(t) : Promise.resolve(prompt(t)); }

/* ============ Segmentos (RFM) ============ */
var SEG = {
  vip:    {n: 'Campeonas', c: 'c-vip', d: 'Compran seguido, hace poco y gastan más.', a: 'Agradece, avísales primero de las novedades y pídeles que te recomienden.'},
  leal:   {n: 'Leales', c: 'c-leal', d: 'Varias compras y siguen activas.', a: 'Envía novedades de sus categorías favoritas y recuérdales sus puntos.'},
  nueva:  {n: 'Nuevas', c: 'c-nueva', d: 'Primera compra en los últimos 30 días.', a: 'Pregunta qué tal les quedó y motiva la segunda compra.'},
  prom:   {n: 'Prometedoras', c: 'c-prom', d: 'Compraron 1–2 veces en los últimos 60 días.', a: 'Muéstrales prendas parecidas a lo que compraron.'},
  riesgo: {n: 'En riesgo', c: 'c-riesgo', d: 'Eran buenas clientas y llevan más de 60 días sin volver.', a: 'Escríbeles personalmente con algo pensado para ellas.'},
  dorm:   {n: 'Dormidas', c: 'c-dorm', d: 'Entre 61 y 90 días sin comprar.', a: 'Mensaje de reactivación con novedades.'},
  perd:   {n: 'Perdidas', c: 'c-perd', d: 'Más de 90 días sin comprar.', a: 'Campaña de regreso con una oferta clara, o pide permiso para escribirles.'},
  lead:   {n: 'Interesadas', c: 'c-lead', d: 'Contactos que aún no compran.', a: 'Envía fotos de lo que buscan y una invitación a la tienda.'}
};
var SEG_ORDER = ['vip', 'leal', 'nueva', 'prom', 'riesgo', 'dorm', 'perd', 'lead'];
var rScore = function(days){ return days <= 15 ? 5 : days <= 30 ? 4 : days <= 60 ? 3 : days <= 90 ? 2 : 1; };
var fScore = function(f){ return f >= 6 ? 5 : f >= 4 ? 4 : f; };
function segmentOf(c){
  if (!c.F) return 'lead';
  var R = c.R, F = c.Fs, M = c.Ms;
  if (R >= 4 && F >= 3 && M >= 4) return 'vip';
  if (R >= 3 && F >= 3) return 'leal';
  if (F === 1 && R >= 4) return 'nueva';
  if (R >= 3) return 'prom';
  if (F >= 3 || M >= 4) return 'riesgo';
  if (R === 2) return 'dorm';
  return 'perd';
}

/* ============ Mensajes ============ */
var MSG = {
  cobro:   {l: 'Cobro', mk: false, t: 'Hola {nombre} 💕 Te escribimos de Galia Shop para recordarte tu saldo de {saldo}{vence}. Puedes abonar por transferencia o en la tienda. ¡Gracias por tu confianza!'},
  post:    {l: 'Post-venta', mk: false, t: 'Hola {nombre} 💕 ¿Qué tal te quedó tu compra en Galia Shop? Si necesitas cambio de talla o tienes alguna duda, aquí estamos.'},
  bday:    {l: 'Cumpleaños', mk: true, t: '¡Feliz cumpleaños, {nombre}! 🎉 En Galia Shop queremos celebrarte: tienes un detalle especial en tu próxima compra. ¡Que tengas un día hermoso!'},
  react:   {l: 'Reactivar', mk: true, t: 'Hola {nombre} 💕 Te extrañamos en Galia Shop. Llegaron prendas nuevas que te pueden encantar. ¿Te envío fotos?'},
  nuevo:   {l: 'Segunda compra', mk: true, t: 'Hola {nombre} 💖 Gracias por tu primera compra en Galia Shop. Llegaron novedades en {categoria} que combinan con lo que llevaste. ¿Te mando fotos?'},
  top:     {l: 'Agradecer', mk: true, t: 'Hola {nombre} 💖 ¡Gracias por elegirnos! Eres una de nuestras mejores clientas. Pronto te contamos las novedades antes que a nadie.'},
  puntos:  {l: 'Puntos', mk: true, t: 'Hola {nombre} 🎁 Tienes {puntos} puntos en Galia Shop, que equivalen a {valor} de descuento en tu próxima compra. ¡Te esperamos!'},
  permiso: {l: 'Pedir permiso', mk: false, t: 'Hola {nombre}, te saluda Galia Shop 💕 ¿Te gustaría recibir por WhatsApp nuestras novedades y promociones? Responde SÍ y solo te escribiremos cuando haya algo especial. Si prefieres no recibirlas, responde NO.'},
  libre:   {l: 'Mensaje', mk: false, t: 'Hola {nombre} 💕 Te saluda Galia Shop.'}
};
var MSG_EDIT = ['cobro', 'post', 'bday', 'react', 'nuevo', 'top', 'puntos', 'permiso'];

/* ============ Estado ============ */
var LSB = 'galia-crm-respaldo';
var sales = [], inventory = [], S = {}, offline = false;
var view = 'seg', cliFilter = 'all', cliQuery = '', cliSort = 'total', openKey = null;
var C = [], byKey = {}, fichaDirty = false;

function fix(st){
  st = st && typeof st === 'object' ? st : {};
  st.tpl = st.tpl || {}; st.contacted = st.contacted || {};
  var c = st.crm = (st.crm && typeof st.crm === 'object') ? st.crm : {};
  c.v = 1; c.prof = c.prof || {}; c.alias = c.alias || {}; c.nodup = c.nodup || []; c.tasks = c.tasks || []; c.log = c.log || [];
  c.cfg = c.cfg || {consent: true};
  if (c.pts) c.pts.mov = c.pts.mov || [];
  return st;
}
var tpl = function(k){ return S.tpl[k] || MSG[k].t; };

/* ---------- Guardado: se relee la hoja y se aplica el cambio encima (no pisa lo de otro dispositivo) ---------- */
var queue = [], saving = false, retryT = null;
function mutate(fn, note){
  fn(S); queue.push(fn);
  try { localStorage.setItem(LSB, JSON.stringify(S)); } catch(_){}
  rebuild(); tip(note || 'Guardando…');
  flush();
}
async function flush(){
  if (saving || !queue.length) return;
  saving = true; clearTimeout(retryT);
  while (queue.length) {
    var ops = queue.slice();
    try {
      var r = await fetch('/api/settings', {cache: 'no-store'});
      if (!r.ok) throw new Error('leer');
      var fresh = fix((await r.json()).settings || {});
      ops.forEach(function(f){ f(fresh); });
      var w = await fetch('/api/settings', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({settings: fresh})});
      var wj = await w.json().catch(function(){ return {}; });
      if (!w.ok || wj.error) throw new Error(wj.error || 'guardar');
      queue.splice(0, ops.length);
      S = fresh; queue.forEach(function(f){ f(S); });
      offline = false; tip('Guardado en Google Drive ✓', 1600);
    } catch(e) {
      offline = true; tip('Sin conexión: se guardará al volver internet', 3000);
      retryT = setTimeout(flush, 15000);
      break;
    }
  }
  saving = false;
  try { localStorage.setItem(LSB, JSON.stringify(S)); } catch(_){}
  rebuild();
}
var tipT;
function tip(t, ms){ var e = $('saveTip'); e.textContent = t; e.classList.add('show'); clearTimeout(tipT); if (ms) tipT = setTimeout(function(){ e.classList.remove('show'); }, ms); }

/* ============ Construcción de la base de clientes ============ */
function itemsOf(x){ return Array.isArray(x.items) && x.items.length ? x.items : [{description: x.description || '', code: x.code || '', quantity: 1, price: Number(x.amount) || 0}]; }
function rawKey(s){
  var ph = phoneKey(s.phone); if (ph) return 'p' + ph;
  var ci = digits(s.cedula); if (ci) return 'c' + ci;
  var n = norm(s.client); return n ? 'n' + n : null;
}
function resolve(k){ var a = S.crm.alias, i = 0; while (k && a[k] && i++ < 12) k = a[k]; return k; }

function rebuild(){
  var crm = S.crm, t = today();
  var cat = {};
  (Array.isArray(inventory) ? inventory : []).forEach(function(p){ var k = String(p.code || '').trim().toUpperCase(); if (k) cat[k] = p.category || p.categoria || ''; });
  var map = {}, phIdx = {}, ciIdx = {};
  Object.keys(crm.prof).forEach(function(k){ var p = crm.prof[k], rk = resolve(k); if (phoneKey(p.phone)) phIdx[phoneKey(p.phone)] = rk; if (digits(p.cedula).length >= 6) ciIdx[digits(p.cedula)] = rk; });
  function get(k, name){
    k = resolve(k);
    return map[k] || (map[k] = {key: k, name: name || '', buys: [], sales: [], names: {}, cat: {}, pe: 0, phone: '', cedula: '', email: '', address: '', birthday: '', histCredit: 0});
  }
  // 1) Historial (corte 02/10/2026)
  ((crm.hist && crm.hist.clientes) || []).forEach(function(h){
    var k = 'n' + norm(h.n), c = get(k, h.n);
    c.names[h.n] = 1; if (!c.name) c.name = h.n;
    h.h.forEach(function(v){ var cr = Number(v[3]) || 0; c.buys.push({d: v[0], amt: Number(v[1]) || 0, u: Number(v[2]) || 0, paid: r2(v[1] - cr), credit: cr, src: 'h'}); c.histCredit += cr; });
    Object.keys(h.cat || {}).forEach(function(x){ c.cat[x] = (c.cat[x] || 0) + h.cat[x]; });
    c.pe += h.pe || 0;
  });
  // 2) Ventas registradas en la app
  sales.slice().sort(function(a, b){ return String(a.date).localeCompare(String(b.date)) || String(a.created || '').localeCompare(String(b.created || '')); }).forEach(function(s){
    var rk = rawKey(s); if (!rk) return;
    var k = crm.alias[rk] ? resolve(rk) : null;
    if (!k) { var ph = phoneKey(s.phone), ci = digits(s.cedula); k = (ph && phIdx[ph]) || (ci.length >= 6 && ciIdx[ci]) || null; }
    if (!k) { var nn = norm(s.client); if (nn.split(' ').length >= 2 && map[resolve('n' + nn)]) k = resolve('n' + nn); }
    var c = get(k || rk, s.client);
    if (s.client) { c.name = String(s.client).trim(); c.names[c.name] = 1; }
    ['phone', 'cedula', 'email', 'address', 'birthday'].forEach(function(f){ if (s[f]) c[f] = String(s[f]).trim(); });
    if (phoneKey(s.phone) && !phIdx[phoneKey(s.phone)]) phIdx[phoneKey(s.phone)] = c.key;
    if (digits(s.cedula).length >= 6 && !ciIdx[digits(s.cedula)]) ciIdx[digits(s.cedula)] = c.key;
    var u = 0;

    var amt = Number(s.amount) || 0, paid = s.paid != null ? Number(s.paid) || 0 : amt;
    c.sales.push(s);
    c.buys.push({d: s.date, amt: amt, u: u, paid: paid, credit: s.paymentType === 'credito' ? amt : 0, bal: Math.max(0, r2(amt - paid)), due: s.dueDate || (s.paymentType === 'credito' ? addDays(s.date, 7) : ''), src: 'a', s: s});
  });
  // 3) Contactos creados a mano (interesadas) y datos editados
  Object.keys(crm.prof).forEach(function(k){ var p = crm.prof[k]; if (crm.alias[k]) return; if (!map[k] && p.name) get(k, p.name); });
  var pts = crm.pts && crm.pts.on ? crm.pts : null, movBy = {}, logBy = {};
  if (pts) pts.mov.forEach(function(m){ var k = resolve(m.k); (movBy[k] = movBy[k] || []).push(m); });
  crm.log.forEach(function(l){ var k = resolve(l.k); (logBy[k] = logBy[k] || []).push(l); });
  var list = Object.keys(map).map(function(k){ return map[k]; });
  list.forEach(function(c){
    var p = crm.prof[c.key] || {};
    ['name', 'phone', 'cedula', 'email', 'address', 'birthday'].forEach(function(f){ if (p[f]) c[f] = p[f]; });
    c.tags = p.tags || []; c.ok = p.ok || ''; c.okD = p.okD || ''; c.notes = p.notes || []; c.manual = !!p.manual; c.interest = p.interest || '';
    c.buys.sort(function(a, b){ return a.d.localeCompare(b.d); });
    var days = {}; c.buys.forEach(function(b){ days[b.d] = 1; });
    c.F = Object.keys(days).length;
    c.total = r2(c.buys.reduce(function(n, b){ return n + b.amt; }, 0));
    c.units = c.buys.reduce(function(n, b){ return n + b.u; }, 0);
    c.first = c.buys.length ? c.buys[0].d : ''; c.last = c.buys.length ? c.buys[c.buys.length - 1].d : '';
    c.days = c.last ? diffDays(c.last, t) : null;
    c.ticket = c.F ? r2(c.total / c.F) : 0;
    c.balance = r2(c.buys.reduce(function(n, b){ return n + (b.bal || 0); }, 0));
    c.credits = c.buys.filter(function(b){ return b.bal > 0; });
    c.overdue = c.credits.filter(function(b){ return b.due && b.due < t; });
    c.topCat = Object.keys(c.cat).sort(function(a, b){ return c.cat[b] - c.cat[a]; }).slice(0, 3);
    c.log = (logBy[c.key] || []).sort(function(a, b){ return b.d.localeCompare(a.d); });
    if (pts) {
      c.earned = c.buys.reduce(function(n, b){ return b.d >= pts.start ? n + Math.floor(b.paid * pts.rate) : n; }, 0);
      c.mov = (movBy[c.key] || []).sort(function(a, b){ return b.d.localeCompare(a.d); });
      c.points = Math.max(0, c.earned + c.mov.reduce(function(n, m){ return n + m.p; }, 0));
    } else { c.points = 0; c.mov = []; }
  });
  // RFM: recencia y frecuencia con umbrales fijos; monto por quintiles
  var buyers = list.filter(function(c){ return c.F; });

  });

  C = list; byKey = {}; list.forEach(function(c){ byKey[c.key] = c; });
  render();
}

function waNumber(phone){
  var d = digits(phone); if (!d) return '';
  if (d.length === 10 && d[0] === '0') d = '593' + d.slice(1);
  else if (d.length === 9 && d[0] === '9') d = '593' + d;
  return d.length >= 10 ? d : '';
}
function fill(text, c){
  var pts = S.crm.pts && S.crm.pts.on ? S.crm.pts : null;
  var due = c.credits && c.credits.length ? c.credits.map(function(b){ return b.due; }).sort()[0] : '';
  return text.replace(/\{nombre\}/g, first(c.name) || 'hola')
    .replace(/\{saldo\}/g, money(c.balance))
    .replace(/\{vence\}/g, due ? (due < today() ? ', que venció el ' + fmt(due) : ', que vence el ' + fmt(due)) : '')
    .replace(/\{puntos\}/g, String(c.points || 0))
    .replace(/\{valor\}/g, pts ? money(Math.floor((c.points || 0) / pts.need) * pts.val) : '$0.00')

function nextBirthday(b, t){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(b || ''); if (!m) return null;
  var y = Number(t.slice(0, 4)), md = (m[2] === '02' && m[3] === '29') ? '02-28' : m[2] + '-' + m[3];
  var n = y + '-' + md; if (n < t) n = (y + 1) + '-' + md;
  return {d: n, days: diffDays(t, n), age: Number(n.slice(0, 4)) - Number(m[1])};
}

    }

    var lastApp = null; c.buys.forEach(function(b){ if (b.src === 'a') lastApp = b; });

    if (c.F === 1 && c.days >= 10 && c.days <= 25 && !lastLog(c, 'nuevo')) { if (hasWa) g.nuevo.push({c: c}); else g.noPhone++; }
    if ((c.seg === 'riesgo' || c.seg === 'dorm') && c.ok !== 'no') { var lr = lastLog(c, 'react') || S.contacted[c.key]; if (!lr || diffDays(lr, t) >= 30) { if (hasWa) g.react.push({c: c}); else g.noPhone++; } }

function dupPairs(){
  var tok = function(n){ return norm(n).replace(/z/g, 's').replace(/ll/g, 'y').replace(/(.)\1/g, '$1').split(' ').filter(Boolean); };
  var nd = {}; S.crm.nodup.forEach(function(x){ nd[x] = 1; });
  var out = [], L = C.map(function(c){ return {c: c, t: tok(c.name), ph: phoneKey(c.phone), ci: digits(c.cedula)}; });
  for (var i = 0; i < L.length; i++) for (var j = i + 1; j < L.length; j++) {
    var a = L[i], b = L[j], why = '';
    if (a.ph && a.ph === b.ph) why = 'mismo celular';
    else if (a.ci.length >= 6 && a.ci === b.ci) why = 'misma cédula';
    else if (a.t.length && b.t.length && a.t[0] === b.t[0]) {
      var s = a.t.length <= b.t.length ? a : b, l = s === a ? b : a;
      if (s.t.every(function(x){ return l.t.indexOf(x) >= 0; })) why = s.t.length === l.t.length ? 'mismo nombre' : 'nombre parecido';
    }
    if (!why) continue;
    var id = [a.c.key, b.c.key].sort().join('|'); if (nd[id]) continue;
    out.push({a: a.c, b: b.c, why: why, id: id});
  }
  return out;
}

/* ============ Segmentos ============ */
function renderRfm(){
  var buyers = C.filter(function(c){ return c.F; }), tot = buyers.reduce(function(n, c){ return n + c.total; }, 0) || 1;
  var agg = {}; SEG_ORDER.forEach(function(k){ agg[k] = {n: 0, m: 0, f: 0, d: 0}; });
  C.forEach(function(c){ var a = agg[c.seg]; a.n++; a.m += c.total; a.f += c.F; a.d += c.days || 0; });
  var h = '<div class="panel"><div class="head"><div><h2>Segmentos de clientes (RFM)</h2><p class="sub">Cada clienta se califica por <b>R</b>ecencia (días desde la última compra: ≤15, ≤30, ≤60, ≤90, más), <b>F</b>recuencia (días distintos con compra: 1, 2, 3, 4–5, 6+) y <b>M</b>onto (quintiles del gasto total). Se recalcula con cada venta.</p></div></div><div class="segs">' +
    SEG_ORDER.filter(function(k){ return agg[k].n; }).map(function(k){ var a = agg[k], sh = a.m / tot * 100;

        (k !== 'lead' ? '<div class="bar"><i style="width:' + Math.max(2, sh).toFixed(1) + '%"></i></div><p><b>' + sh.toFixed(0) + '%</b> de las ventas · ticket ' + money(a.f ? a.m / a.f : 0) + ' · ' + Math.round(a.d / a.n) + ' días sin comprar en promedio</p>' : '') +
        '<div class="do">👉 ' + SEG[k].a + '</div><button type="button" class="btn sm sec" data-goseg="' + k + '">Ver ' + plural(a.n, 'clienta') + '</button></div>'; }).join('') + '</div></div>';
  // Matriz R x F
  var grid = {}; buyers.forEach(function(c){ var k = c.R + '-' + c.Fs; grid[k] = (grid[k] || 0) + 1; });
  var mx = Math.max.apply(null, Object.keys(grid).map(function(k){ return grid[k]; }).concat([1]));

  for (var r = 5; r >= 1; r--) {
    h += '<tr><th style="text-align:right">' + rl[r] + '</th>';
    for (var f = 1; f <= 5; f++) { var v = grid[r + '-' + f] || 0, a = v ? 0.12 + 0.88 * v / mx : 0; h += '<td style="background:' + (v ? 'rgba(168,97,123,' + a.toFixed(2) + ')' : '#f6eff2') + ';color:' + (a > 0.55 ? '#fff' : '#6b3d50') + '">' + (v || '') + '</td>'; }
    h += '</tr>';
  }
  h += '<tr><th></th>' + [1, 2, 3, 4, 5].map(function(f){ return '<th>' + fl[f] + '</th>'; }).join('') + '</tr></tbody></table></div><p class="sub">Filas: días desde la última compra · Columnas: número de compras.</p></div>';
  // Indicadores
  var rep = buyers.filter(function(c){ return c.F >= 2; }).length, act = buyers.filter(function(c){ return c.days <= 60; }).length;
  var top20 = buyers.slice().sort(function(a, b){ return b.total - a.total; }).slice(0, Math.max(1, Math.round(buyers.length * 0.2))).reduce(function(n, c){ return n + c.total; }, 0);
  var cats = {}; buyers.forEach(function(c){ Object.keys(c.cat).forEach(function(k){ cats[k] = (cats[k] || 0) + c.cat[k]; }); });
  var catL = Object.keys(cats).sort(function(a, b){ return cats[b] - cats[a]; }).slice(0, 6), cm = catL.length ? cats[catL[0]] : 1;
  h += '<div class="panel"><h2>Indicadores de la cartera</h2><table><tbody>' +
    '<tr><td>Tasa de recompra</td><td class="num"><b>' + (buyers.length ? Math.round(rep / buyers.length * 100) : 0) + '%</b><span class="meta">' + rep + ' de ' + buyers.length + ' compraron 2+ veces</span></td></tr>' +
    '<tr><td>Clientas activas (60 días)</td><td class="num"><b>' + act + '</b><span class="meta">' + (buyers.length ? Math.round(act / buyers.length * 100) : 0) + '% de la cartera</span></td></tr>' +
    '<tr><td>Peso del 20% que más compra</td><td class="num"><b>' + Math.round(top20 / tot * 100) + '%</b><span class="meta">de todas las ventas</span></td></tr>' +
    '<tr><td>Ticket promedio por visita</td><td class="num"><b>' + money(tot / Math.max(1, buyers.reduce(function(n, c){ return n + c.F; }, 0))) + '</b></td></tr>' +
    '<tr><td>Valor promedio por clienta</td><td class="num"><b>' + money(tot / Math.max(1, buyers.length)) + '</b></td></tr>' +
    '<tr><td>Con celular para WhatsApp</td><td class="num"><b>' + C.filter(function(c){ return waNumber(c.phone); }).length + '</b><span class="meta">de ' + C.length + '</span></td></tr>' +
    '<tr><td>Aceptan promociones</td><td class="num"><b>' + C.filter(function(c){ return c.ok === 'si'; }).length + '</b></td></tr>' +
    '</tbody></table>' + (catL.length ? '<h3 style="margin-top:16px">Categorías más compradas (unidades)</h3>' + catL.map(function(k){ return '<div style="margin:7px 0;font-size:13px"><div style="display:flex;justify-content:space-between"><span>' + esc(k) + '</span><b>' + cats[k] + '</b></div><div class="bar"><i style="width:' + (cats[k] / cm * 100).toFixed(0) + '%"></i></div></div>'; }).join('') : '') + '</div></div>';

async function redeem(k){
  var c = byKey[k], p = S.crm.pts; if (!c || !p) return;

  var m = {id: uid(), k: k, d: today(), p: -n * p.need, m: 'Canje ' + money(n * p.val), by: me()};

  h += '<div class="panel"><details><summary>Unir con otro registro de la misma persona</summary><p class="sub">Úsalo si la misma clienta aparece con dos nombres (ej. “Freya” y “Freya Pazmiño”). Sus compras se suman en esta ficha.</p><div style="display:flex;gap:6px;flex-wrap:wrap"><input id="fMergeQ" list="fMergeL" placeholder="Escribe el otro nombre" style="flex:1;min-width:200px;border:1px solid #d8bec8;border-radius:10px;padding:9px 11px;font:inherit;min-height:42px"><datalist id="fMergeL">' +
    C.filter(function(x){ return x.key !== c.key; }).map(function(x){ return '<option value="' + esc(x.name) + ' · ' + money(x.total) + '">'; }).join('') + '</datalist><button type="button" class="btn sm" id="fMerge">Unir</button></div>' +
    (aliasOf.length ? '<p class="sub">Incluye registros unidos: ' + aliasOf.map(function(a){ return '<button type="button" class="lnk" data-unmerge="' + esc(a) + '">Separar ' + esc(aliasName(a)) + '</button>'; }).join(' ') + '</p>' : '') + '</details></div></div>';
  ov.innerHTML = h; fichaDirty = false;
  if (!ov.parentNode) document.body.appendChild(ov);
  ov.oninput = function(e){ if (e.target.closest('.fgrid') || e.target.id === 'fNote') fichaDirty = true; };
  document.body.style.overflow = 'hidden';
  var g = function(id){ return ov.querySelector('#' + id); };
  g('fSave').onclick = function(){
    var ok = g('fOk').value, by = me(), d = today();
    var patch = {name: g('fName').value.trim(), phone: g('fPhone').value.trim(), cedula: g('fCed').value.trim(), email: g('fMail').value.trim(), birthday: g('fBday').value, address: g('fAddr').value.trim(),
      tags: g('fTags').value.split(',').map(function(x){ return x.trim(); }).filter(Boolean), interest: g('fInt').value.trim(), ok: ok};
    var key = c.key, prevOk = c.ok;
    mutate(function(st){ var pr = st.crm.prof[key] = st.crm.prof[key] || {}; Object.keys(patch).forEach(function(f){ pr[f] = patch[f]; }); if (ok !== prevOk) { pr.okD = ok ? d : ''; pr.okBy = ok ? by : ''; } }, 'Ficha guardada');
    openClient(key);
  };
  g('fAddNote').onclick = function(){ var v = g('fNote').value.trim(); if (!v) return; var n = {t: v, d: today(), by: me()}, key = c.key;
    mutate(function(st){ var pr = st.crm.prof[key] = st.crm.prof[key] || {}; pr.notes = (pr.notes || []).concat([n]); }, 'Nota guardada'); openClient(key); };
  g('fNote').onkeydown = function(e){ if (e.key === 'Enter') g('fAddNote').click(); };
  g('fMerge').onclick = async function(){
    var v = g('fMergeQ').value.split(' · ')[0].trim(); var o = C.filter(function(x){ return x.key !== c.key && norm(x.name) === norm(v); })[0];
    if (!o) { tip('No encontré a “' + v + '”. Elige un nombre de la lista.', 2500); return; }
    if (!(await confirmBox('¿Unir “' + o.name + '” (' + money(o.total) + ') dentro de la ficha de “' + c.name + '”?\nSe podrá separar después.'))) return;
    mergeInto(c.key, o.key);
  };
  if (focus) setTimeout(function(){ var e = g(focus === 'phone' ? 'fPhone' : focus); if (e) { e.focus(); e.scrollIntoView({block: 'center'}); } }, 60);
}
function aliasName(a){
  var h = ((S.crm.hist && S.crm.hist.clientes) || []).filter(function(x){ return 'n' + norm(x.n) === a; })[0];
  if (h) return h.n;
  var p = S.crm.prof[a]; if (p && p.name) return p.name;
  var s = sales.filter(function(x){ return rawKey(x) === a; })[0];
  return s ? s.client : a.slice(1);
}
function closeClient(){ var o = $('ficha'); if (o) o.remove(); openKey = null; document.body.style.overflow = ''; }
function mergeInto(keep, gone){
  var pg = S.crm.prof[gone];
  mutate(function(st){
    st.crm.alias[gone] = keep;
    Object.keys(st.crm.alias).forEach(function(x){ if (st.crm.alias[x] === gone) st.crm.alias[x] = keep; });
    if (pg) { var pk = st.crm.prof[keep] = st.crm.prof[keep] || {};
      ['phone', 'cedula', 'email', 'birthday', 'address', 'interest', 'ok', 'okD'].forEach(function(f){ if (!pk[f] && pg[f]) pk[f] = pg[f]; });
      pk.notes = (pk.notes || []).concat(pg.notes || []); pk.tags = Array.from(new Set((pk.tags || []).concat(pg.tags || []))); }
  }, 'Registros unidos');
  if (openKey) openClient(keep);
}

/* ============ Diálogos ============ */
function taskDialog(k){
  var o = document.createElement('div'); o.className = 'ov'; o.style.justifyContent = 'center'; o.style.alignItems = 'center'; o.style.padding = '18px';
  o.innerHTML = '<form class="panel" style="width:min(100%,440px);margin:0"><h2>Nueva tarea</h2><p class="sub">Aparecerá en “Para hoy” el día indicado.</p>' +
    (k ? '' : '<label class="fld" style="margin-top:10px">Cliente<input id="tCli" list="tCliL" required placeholder="Escribe el nombre"><datalist id="tCliL">' + C.map(function(c){ return '<option value="' + esc(c.name) + '">'; }).join('') + '</datalist></label>') +
    '<label class="fld" style="margin-top:10px">Qué hacer<input id="tTxt" required placeholder="Ej. avisar que llegó la talla M"></label>' +
    '<div class="chips" style="margin:10px 0 0">' + [['Hoy', 0], ['Mañana', 1], ['En 3 días', 3], ['En una semana', 7]].map(function(x){ return '<button type="button" class="chip" data-in="' + x[1] + '">' + x[0] + '</button>'; }).join('') + '</div>' +
    '<label class="fld" style="margin-top:8px">Fecha<input id="tDue" type="date" required value="' + addDays(today(), 1) + '"></label>' +
    '<p class="status err" id="tErr"></p><div class="acts"><button type="button" class="btn sec" data-x>Cancelar</button><button class="btn">Guardar tarea</button></div></form>';
  document.body.appendChild(o);
  var q = function(s){ return o.querySelector(s); };
  (q('#tCli') || q('#tTxt')).focus();
  o.addEventListener('click', function(e){ var b = e.target.closest('[data-in]'); if (b) q('#tDue').value = addDays(today(), Number(b.dataset.in)); if (e.target.closest('[data-x]') || e.target === o) o.remove(); });
  q('form').onsubmit = function(e){
    e.preventDefault();
    var key = k;
    if (!key) { var v = norm(q('#tCli').value), m = C.filter(function(c){ return norm(c.name) === v; }); if (!m.length) { q('#tErr').textContent = 'Elige un cliente de la lista (o créalo en “Clientes → + Nueva”).'; return; } key = m[0].key; }
    var task = {id: uid(), k: key, text: q('#tTxt').value.trim(), due: q('#tDue').value || today(), by: me(), at: today()};
    mutate(function(st){ st.crm.tasks.push(task); }, 'Tarea guardada'); o.remove();
    if (openKey) openClient(openKey);
  };
}
async function newClient(){
  var n = await promptBox('Nombre de la persona interesada:'); if (!n || !n.trim()) return;
  var ph = await promptBox('Celular (opcional):');
  var key = 'm' + uid(), d = today();
  mutate(function(st){ st.crm.prof[key] = {name: n.trim(), phone: (ph || '').trim(), manual: true, created: d}; }, 'Contacto creado');
  setTimeout(function(){ openClient(key); }, 50);
}
function exportCsv(){
  var rows = [['Cliente', 'Celular', 'Cédula', 'Correo', 'Cumpleaños', 'Segmento', 'R', 'F', 'M', 'Compras', 'Prendas', 'Total', 'Ticket', 'Primera compra', 'Última compra', 'Días sin comprar', 'Saldo', 'Puntos', 'Acepta promos', 'Categorías', 'Etiquetas']];
  C.forEach(function(c){ rows.push([c.name, c.phone, c.cedula, c.email, c.birthday, SEG[c.seg].n, c.R || '', c.Fs || '', c.Ms || '', c.F, c.units, c.total.toFixed(2), c.ticket.toFixed(2), c.first, c.last, c.days == null ? '' : c.days, c.balance.toFixed(2), c.points, c.ok === 'si' ? 'Sí' : c.ok === 'no' ? 'No' : '', c.topCat.join(' / '), c.tags.join(' / ')]); });
  var csv = '﻿' + rows.map(function(r){ return r.map(function(v){ v = String(v == null ? '' : v); return /[";\n,]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); }).join('\r\n');
  var blob = new Blob([csv], {type: 'text/csv;charset=utf-8'}), name = 'Clientes_GaliaShop_' + today() + '.csv';
  if (window.parent && window.parent.galiaSave) window.parent.galiaSave(blob, name);
  else { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
}

/* ============ Importar historial ============ */
$('histFile').onchange = async function(){
  var f = this.files[0]; this.value = ''; if (!f) return;
  try {
    var d = JSON.parse(await f.text());
    if (!d || d.tipo !== 'galia-historial-clientes' || !Array.isArray(d.clientes)) throw 0;
    var tot = d.clientes.reduce(function(n, c){ return n + c.h.reduce(function(m, v){ return m + Number(v[1]); }, 0); }, 0);
    if (!(await confirmBox('Cargar el historial de ' + d.clientes.length + ' clientes (' + money(tot) + ' en compras hasta el ' + fmtY(d.corte) + ').\n\nNo modifica tus ventas; solo se usa para la ficha y los segmentos.'))) return;
    var h = {corte: d.corte, fuente: d.fuente || '', cargado: today(), clientes: d.clientes};
    mutate(function(st){ st.crm.hist = h; }, 'Historial cargado');
  } catch(e) { tip('Ese archivo no es el historial de clientes de Galia Shop.', 3500); }
};

/* ============ Pintar ============ */
function render(){
  var buyers = C.filter(function(c){ return c.F; }), t = today();
  var act = buyers.filter(function(c){ return c.days <= 60; }).length, rep = buyers.filter(function(c){ return c.F >= 2; }).length;
  var debt = C.reduce(function(n, c){ return n + c.balance; }, 0), ov = C.filter(function(c){ return c.overdue.length; }).length;
  $('kpis').innerHTML = '<div class="kpi"><small>Clientes</small><strong>' + buyers.length + '</strong><span>' + (C.length - buyers.length ? (C.length - buyers.length) + ' interesadas sin compra' : 'con al menos una compra') + '</span></div>' +
    '<div class="kpi"><small>Activas (60 días)</small><strong>' + act + '</strong><span>' + (buyers.length ? Math.round(act / buyers.length * 100) : 0) + '% de la cartera</span></div>' +
    '<div class="kpi"><small>Recompra</small><strong>' + (buyers.length ? Math.round(rep / buyers.length * 100) : 0) + '%</strong><span>volvieron a comprar</span></div>' +
    '<div class="kpi"><small>Por cobrar</small><strong' + (debt ? ' style="color:#a1452f"' : '') + '>' + money(debt) + '</strong><span>' + (ov ? plural(ov, 'crédito vencido', 'créditos vencidos') : 'créditos de la app') + '</span></div>';
  var b = '';
  if (!S.crm.hist) b += '<div class="banner info"><span>📂 <b>Carga el historial</b> (junio – 2 de octubre) para ver las compras anteriores de las 125 clientas. Es el archivo “Historial_clientes_GaliaShop.json”.</span><button type="button" class="btn sm" id="bHist">Cargar historial</button></div>';
  if (offline) b += '<div class="banner warn"><span>⚠️ No se pudo guardar en Google Drive. Los cambios quedan en este dispositivo y se envían solos cuando vuelva la conexión.</span><button type="button" class="btn sm sec" id="bRetry">Reintentar</button></div>';
  $('banners').innerHTML = b;
  if ($('bHist')) $('bHist').onclick = function(){ $('histFile').click(); };
  if ($('bRetry')) $('bRetry').onclick = flush;
  $('status').textContent = S.crm.hist ? 'Historial hasta el ' + fmtY(S.crm.hist.corte) + ' + ' + plural(sales.length, 'venta') + ' de la app.' : plural(sales.length, 'venta') + ' de la app.';
  $('status').className = 'status';
  // No se repinta lo que la persona está escribiendo
  var ae = document.activeElement;
  if (!(ae && ae.matches && ae.matches('textarea[data-tpl]'))) renderSeg();
  if (!(ae && ae.id === 'q')) renderCli();
  renderRfm(); if (!(ae && ae.closest && ae.closest('#v-pts input'))) renderPts();
  ['seg', 'cli', 'rfm', 'pts'].forEach(function(v){ $('v-' + v).hidden = v !== view; });
  if (openKey && $('ficha') && !fichaDirty) { var y = $('ficha').firstChild.scrollTop; openClient(openKey); $('ficha').firstChild.scrollTop = y; }
}

/* ============ Eventos ============ */
$('views').addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; view = b.dataset.v; Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle('on', x === b); }); ['seg', 'cli', 'rfm', 'pts'].forEach(function(v){ $('v-' + v).hidden = v !== view; }); window.scrollTo({top: 0}); });
document.addEventListener('click', function(e){
  var t;
  if ((t = e.target.closest('[data-close]')) || e.target.id === 'ficha') { closeClient(); return; }
  if ((t = e.target.closest('a[data-wa]'))) { logContact(t.dataset.wa, t.dataset.type, t.dataset.task); return; }
  if ((t = e.target.closest('[data-open]'))) { e.preventDefault(); openClient(t.dataset.open, t.dataset.focus); return; }
  if ((t = e.target.closest('[data-done]'))) { logContact(t.dataset.done, t.dataset.type, t.dataset.task); return; }
  if ((t = e.target.closest('[data-snooze]'))) { var id = t.dataset.snooze, d = addDays(today(), 3); mutate(function(st){ st.crm.tasks.forEach(function(x){ if (x.id === id) x.due = d; }); }, 'Tarea pospuesta'); return; }
  if ((t = e.target.closest('[data-f]'))) { cliFilter = t.dataset.f; if (t.hasAttribute('data-gocli')) document.querySelector('#views [data-v="cli"]').click(); renderCli(); return; }
  if ((t = e.target.closest('[data-goseg]'))) { cliFilter = t.dataset.goseg; view = 'cli'; document.querySelector('#views [data-v="cli"]').click(); renderCli(); return; }
  if ((t = e.target.closest('[data-redeem]'))) { redeem(t.dataset.redeem); return; }
  if ((t = e.target.closest('[data-task-for]'))) { taskDialog(t.dataset.taskFor); return; }
  if ((t = e.target.closest('[data-nodup]'))) { var nd = t.dataset.nodup; mutate(function(st){ if (st.crm.nodup.indexOf(nd) < 0) st.crm.nodup.push(nd); }, 'Marcadas como distintas'); return; }
  if ((t = e.target.closest('[data-merge]'))) { var pr = t.dataset.merge.split('|'), a = byKey[pr[0]], b = byKey[pr[1]]; if (!a || !b) return; var keep = (b.name.length > a.name.length || (b.name.length === a.name.length && b.total > a.total)) ? b : a, gone = keep === a ? b : a;
    confirmBox('¿Unir “' + gone.name + '” dentro de “' + keep.name + '”?\nSus compras se sumarán en una sola ficha. Se puede separar después.').then(function(ok){ if (ok) mergeInto(keep.key, gone.key); }); return; }
  if ((t = e.target.closest('[data-unmerge]'))) { var u = t.dataset.unmerge; mutate(function(st){ delete st.crm.alias[u]; }, 'Registros separados'); return; }
  if ((t = e.target.closest('[data-bonus]'))) { var bk = t.dataset.bonus; promptBox('¿Cuántos puntos de regalo?').then(function(v){ var n = Math.round(Number(v) || 0); if (!n) return; var m = {id: uid(), k: bk, d: today(), p: n, m: 'Regalo', by: me()}; mutate(function(st){ st.crm.pts.mov.push(m); }, 'Puntos agregados'); }); return; }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && openKey) closeClient(); });
var tplT;
document.addEventListener('input', function(e){
  var ta = e.target.closest('textarea[data-tpl]'); if (!ta) return;
  clearTimeout(tplT); var k = ta.dataset.tpl;
  tplT = setTimeout(function(){ var v = ta.value; S.tpl[k] = v; queue.push(function(st){ st.tpl[k] = v; }); flush(); tip('Mensaje guardado', 1200); }, 700);
});
document.addEventListener('change', function(e){ if (e.target.id === 'cfgConsent') { var v = e.target.checked; mutate(function(st){ st.crm.cfg.consent = v; }, v ? 'Se pedirá permiso antes de promociones' : 'Promociones sin pedir permiso'); } });

/* ============ Arranque ============ */
(async function(){
  var ok = true;
  try { var rs = await fetch('/api/settings', {cache: 'no-store'}); if (!rs.ok) throw 0; S = fix((await rs.json()).settings || {}); }
  catch(_){ ok = false; try { S = fix(JSON.parse(localStorage.getItem(LSB) || '{}')); } catch(__){ S = fix({}); } offline = true; }
  try { var r = await fetch('/api/sales', {cache: 'no-store'}); if (!r.ok) throw 0; sales = (await r.json()).sales || []; }
  catch(_){ ok = false; try { sales = JSON.parse(localStorage.getItem('galia-shop-sales-v1') || '[]'); } catch(__){} }
  try { var ri = await fetch('/api/inventory', {cache: 'no-store'}); if (!ri.ok) throw 0; inventory = (await ri.json()).inventory || []; }
  catch(_){ try { inventory = JSON.parse(localStorage.getItem('galia-shop-inventory-v1') || '[]'); } catch(__){} }
  rebuild();
  if (!ok) { $('status').textContent = 'Sin conexión: se muestran los datos guardados en este dispositivo.'; $('status').className = 'status err'; }
})();
})();
</script></body></html>
